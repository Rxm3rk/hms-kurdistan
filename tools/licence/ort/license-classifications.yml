# ORT licence classifications (BUILD-PROMPT.md §4.3, ADR-022). The categories match
# tools/licence/policy.yaml; change the two together (a unit test compares them).
# Used by tools/licence/ort/evaluator.rules.kts. Not run yet: see tools/licence/README.md.
categories:
  - name: "allowed"
    description: "Allowlist (§4.3): allowed in shipped and build-only scopes."
  - name: "conditional"
    description: "Allowed only unmodified and recorded in the licence register (tools/licence/register.yaml)."
  - name: "openjdk-runtime-only"
    description: "GPL-2.0 with the Classpath exception: allowed for the OpenJDK runtime only."
  - name: "copyleft-separate-container"
    description: "GPL and AGPL: shipped only as unmodified, separate containers with a source offer."
  - name: "denied"
    description: "Denylist (§4.3): BSL, SSPL, competing-use and AI-ingestion clauses, functional source licences."
  - name: "build-only-acceptable"
    description: "No use restriction; acceptable for build- and CI-only tools, never shipped [P]."

categorizations:
  # allowed
  - id: "Apache-2.0"
    categories: ["allowed"]
  - id: "MIT"
    categories: ["allowed"]
  - id: "BSD-2-Clause"
    categories: ["allowed"]
  - id: "BSD-3-Clause"
    categories: ["allowed"]
  - id: "ISC"
    categories: ["allowed"]
