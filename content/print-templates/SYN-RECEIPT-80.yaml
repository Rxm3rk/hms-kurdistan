# Synthetic cash receipt, NOT FOR CLINICAL USE (BUILD-PROMPT §19.4; docs/specs/modules/platform-docs.md §4, §7.3).
# 80 mm paper, 72 mm printable (576 dots at 8 dots/mm); a flow layout: elements stack top to bottom in this order, each
# box's y is the gap before it, and the receipt grows with its lines (never below the 60 mm minimum length). The
# patient's identifiers (SI-01) come first, the full DP-8 watermark line last (spec §8.5). Amounts are display strings
# from the owning module and are printed unchanged (spec §2).
# Caption texts in ckb and ar are drafted by the build agent (AI) and UNREVIEWED (spec §14; DN-021 rule).
id: SYN-RECEIPT-80
version: 1
provenance: synthetic
kind: receipt
media:
  width_mm: 80
  length_mm: 60
  rotation: 0
  printable: {x_mm: 4, y_mm: 2, w_mm: 72, h_mm: 56}
captions:
  mrn: {en: "MRN", ckb: "ژمارەی تۆمار", ar: "رقم السجل"}
  dob: {en: "DOB", ckb: "لەدایکبوون", ar: "الميلاد"}
  approximate: {en: "Approx.", ckb: "نزیکەیی", ar: "تقريبي"}
elements:
  - {type: text, bind: notice.synthetic, font: latin, box: {x_mm: 4, y_mm: 0, w_mm: 72, h_mm: 6.5}, size_pt: {max: 8, min: 6}, max_lines: 2, align: center}
  - {type: text, bind: receipt.issuer, font: mixed, box: {x_mm: 4, y_mm: 1, w_mm: 72, h_mm: 10}, size_pt: {max: 9, min: 7}, max_lines: 2, overflow: wrap-grow, align: center}
  - {type: rule, box: {x_mm: 4, y_mm: 1, w_mm: 72, h_mm: 0.25}}
  - {type: text, bind: identity.name.own, font: by-script, weight: bold, box: {x_mm: 4, y_mm: 1.5, w_mm: 72, h_mm: 13}, size_pt: {max: 12, min: 8}, max_lines: 2}
  - {type: text, bind: identity.name.latin, font: latin, weight: bold, box: {x_mm: 4, y_mm: 0.5, w_mm: 72, h_mm: 6.5}, size_pt: {max: 9, min: 6}, max_lines: 2}
  - {type: caption, key: mrn, font: by-label-language, box: {x_mm: 4, y_mm: 1, w_mm: 30, h_mm: 5.2}, size_pt: {max: 7, min: 6}}
  - {type: text, bind: identity.mrn, font: latin, direction: ltr, box: {x_mm: 4, y_mm: 0, w_mm: 50, h_mm: 4.5}, size_pt: {max: 9, min: 7}}
  - {type: caption, key: dob, font: by-label-language, box: {x_mm: 4, y_mm: 0.5, w_mm: 30, h_mm: 5.2}, size_pt: {max: 7, min: 6}}
  - {type: text, bind: identity.birthDate, font: latin, direction: ltr, box: {x_mm: 4, y_mm: 0, w_mm: 40, h_mm: 4.5}, size_pt: {max: 9, min: 7}}
  - {type: caption, key: approximate, font: by-label-language, box: {x_mm: 4, y_mm: 0, w_mm: 30, h_mm: 6.4}, size_pt: {max: 8.5, min: 8}}
  - {type: text, bind: receipt.number, font: latin, direction: ltr, box: {x_mm: 4, y_mm: 1, w_mm: 60, h_mm: 4.5}, size_pt: {max: 9, min: 7}}
  - {type: rule, box: {x_mm: 4, y_mm: 1, w_mm: 72, h_mm: 0.25}}
  - {type: rows, bind: receipt.lines, font: mixed, box: {x_mm: 4, y_mm: 1, w_mm: 72, h_mm: 5}, size_pt: {max: 9, min: 7}, description_w_mm: 48, amount_w_mm: 23}
  - {type: rule, box: {x_mm: 4, y_mm: 1, w_mm: 72, h_mm: 0.25}}
  - {type: rows, bind: receipt.totals, font: mixed, weight: bold, box: {x_mm: 4, y_mm: 1, w_mm: 72, h_mm: 5}, size_pt: {max: 10, min: 7}, description_w_mm: 48, amount_w_mm: 23}
  - {type: text, bind: receipt.cashier, font: mixed, box: {x_mm: 4, y_mm: 1.5, w_mm: 72, h_mm: 5}, size_pt: {max: 8, min: 7}, overflow: wrap-grow}
  - {type: text, bind: receipt.issuedAt, font: latin, direction: ltr, box: {x_mm: 4, y_mm: 0.5, w_mm: 40, h_mm: 4.5}, size_pt: {max: 8, min: 7}}
  - {type: text, bind: watermark, font: mixed, box: {x_mm: 4, y_mm: 2, w_mm: 72, h_mm: 7}, size_pt: {max: 7, min: 6}, max_lines: 2, overflow: wrap-grow}
