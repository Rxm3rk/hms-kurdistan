# TemplateFitCheck; DN-069, OQ-244). SYNTHETIC, NOT FOR CLINICAL USE: every name and identifier here is invented by
# the build agent (AI) as a plausible worst case, and the Sorani and Arabic spellings are UNREVIEWED. The hospital's
# registration field limits and its real longest names are a content request (OQ-244); until then this file stands
# in for them. Every patient template must fit every identity below, with the longest MRN, encounter and date of
# birth, in every label language, at its minimum sizes, at 8, 12 and 24 dots per millimetre.
