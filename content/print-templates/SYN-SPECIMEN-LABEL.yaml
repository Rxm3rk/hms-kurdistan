# Synthetic specimen tube label, NOT FOR CLINICAL USE (BUILD-PROMPT §19.4; docs/specs/modules/platform-docs.md §4,
# §6.1). The default symbol: DataMatrix HMS1|S:<specimen id>|M:<MRN>, so the barcode carries two identifiers (SAC-04);
# the LIS decides the final symbology and payload (WP-1.7, OQ-240). The human-readable specimen ID is right below the
# symbol (lint rule 4).
# 50.8 mm × 38.1 mm, not turned. (The brief named 50.8 × 25.4 mm; with the governed worst-case corpus, a newborn's
# "Baby of" name in Sorani needs two 8 pt lines, 12.1 mm, at the Arabic legibility minimum, and the Latin form two
# 6 pt lines, so the SI-01 set cannot fit 25.4 mm; TemplateFitCheck, OQ-244.) The own name is regular weight: in bold
# the second line of the Sorani "Baby of" name is 50.5 mm wide, over the 47.3 mm the fit rule allows.
# Caption texts in ckb and ar are drafted by the build agent (AI) and UNREVIEWED (spec §14; DN-021 rule).
id: SYN-SPECIMEN-LABEL
version: 1
provenance: synthetic
kind: specimen-label
media:
  width_mm: 50.8
  length_mm: 38.1
  rotation: 0
  printable: {x_mm: 0.5, y_mm: 0.5, w_mm: 49.8, h_mm: 37.1}
captions:
  approximate: {en: "Approx.", ckb: "نزیکەیی", ar: "تقريبي"}
elements:
  - {type: text, bind: identity.name.own, font: by-script, box: {x_mm: 0.5, y_mm: 0.5, w_mm: 49.8, h_mm: 12.4}, size_pt: {max: 11, min: 8}, max_lines: 2}
  - {type: text, bind: identity.name.latin, font: latin, weight: bold, box: {x_mm: 0.5, y_mm: 12.9, w_mm: 49.8, h_mm: 6.1}, size_pt: {max: 8, min: 6}, max_lines: 2}
  - {type: text, bind: identity.mrn, font: latin, direction: ltr, box: {x_mm: 0.5, y_mm: 19.0, w_mm: 22, h_mm: 3.1}, size_pt: {max: 8, min: 6}}
  - {type: text, bind: identity.birthDate, font: latin, direction: ltr, box: {x_mm: 0.5, y_mm: 22.1, w_mm: 14, h_mm: 3.1}, size_pt: {max: 8, min: 6}}
  - {type: caption, key: approximate, font: by-label-language, box: {x_mm: 14.7, y_mm: 22.1, w_mm: 12, h_mm: 6.3}, size_pt: {max: 9, min: 8}}
  - {type: text, bind: watermark, font: latin, direction: ltr, box: {x_mm: 0.5, y_mm: 28.6, w_mm: 30, h_mm: 3.0}, size_pt: {max: 6, min: 4.5}}
  - {type: text, bind: notice.synthetic, font: latin, box: {x_mm: 0.5, y_mm: 31.8, w_mm: 30, h_mm: 5.8}, size_pt: {max: 6, min: 4.5}, max_lines: 2}
  - {type: barcode, bind: barcode.specimen, symbology: datamatrix, box: {x_mm: 37.5, y_mm: 19.5, w_mm: 10.5, h_mm: 10.5}, module_mm: 0.35}
  - {type: text, bind: specimen.id, font: latin, direction: ltr, box: {x_mm: 31, y_mm: 30.6, w_mm: 19.3, h_mm: 3.1}, size_pt: {max: 8, min: 6}}
  - {type: text, bind: specimen.collectedAt, font: latin, direction: ltr, box: {x_mm: 31, y_mm: 33.8, w_mm: 19.3, h_mm: 3.1}, size_pt: {max: 6, min: 4.5}}
