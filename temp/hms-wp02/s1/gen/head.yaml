# The cell's pins: the single source of every version, digest and checksum the dev and lite cells use
# (BUILD-PROMPT.md §4.1, §4.3, §5.1; WP-0.2 plan, slice S1; OQ-124, OQ-125, OQ-135, OQ-136).
#
# - images: each pinned by the digest of its linux/amd64 manifest, the digest the publisher's registry served
#   for the tag on 'resolved_on' (index_digest is the multi-platform index it came from). 'tools/hms cell images
#   mirror' copies exactly that manifest into the local registry under 'local' (crane copy --platform
#   linux/amd64 keeps the digest); 'sign' signs it with the cell key; 'verify' checks the signature offline.
#   Pods reference <registry host>/<local>@<digest>.
# - tools: build-only images the cell tooling runs as containers, pulled by digest from the publisher.
# - charts: each pinned by version and the SHA-256 of its .tgz, which equals the digest in the publisher's
#   Helm repository index.
# - manifests: release manifests that have no chart, pinned by commit and SHA-256 (no checksum is published).
# 'tools/hms cell lint' (fast tier) checks this file: every digest and checksum present and well formed, every
# licence against tools/licence/policy.yaml and the licence register, no image or chart from the vendor whose
# free images §4.1 excludes, one local path per image, and each profile's memory budget.
# Changing a pin is a phase-boundary change (§4.1): change this file, ADR-002's pinned set and the dependency
# scorecard in one commit.
schema_version: 1
resolved_on: "2026-10-19"
platform: linux/amd64

# Kubernetes: k3s v1.35.9+k3s1, the newest k3s line every operator supports (§4.1 "supported by the
# components that depend on it"; OQ-136): Kyverno 1.19 supports Kubernetes 1.33-1.35, Strimzi 1.0.1 is tested
# on 1.30-1.36 and CloudNativePG 1.30 supports 1.34-1.36. The image is 'k3s' below.
kubernetes:
  distribution: k3s
  version: v1.35.9+k3s1
  image: k3s

registry:
  k3d_name: hms-registry.localhost         # 'k3d registry create' name; the container is k3d-<name>
  container: k3d-hms-registry.localhost
  host: k3d-hms-registry.localhost:5000    # the registry's name on the Docker networks below
  host_port: "127.0.0.1:5000"              # published on loopback only: the registry speaks HTTP (KA-020)
  image: registry                          # the entry in images
  storage: registry                        # directory under HMS_CELL_HOME, mounted at /var/lib/registry
  # Address ranges outside Docker's default pools and outside the WSL NAT network (172.28.192.0/20 on this
  # host on 2026-10-19), so no network Docker creates later collides with them.
  network: {name: hms-registry, subnet: 10.213.0.0/24}
  # --internal: no route out. It holds only the registry; signing and verification run here, so they are
  # offline by construction (§4.3; SIG-07).
  offline_network: {name: hms-cell-offline, subnet: 10.213.1.0/24}

guards:
  disk_path: /mnt/c              # the WSL VM's disk image, and with it Docker's data, live on C: (DN-013)
  disk_min_free_gib: 15          # stop pulling below this (DN-013)
  cell_min_available_gib: 6.5    # 'cell up' needs this much available memory before it starts [P]

signing:
  tool: cosign
  key_dir: keys                          # under HMS_CELL_HOME: cosign.key (mode 600) and cosign.pub
  signing_config: signing-config.json    # under HMS_CELL_HOME: no Fulcio, Rekor, OIDC or timestamp service
  passphrase_env: HMS_COSIGN_PASSWORD    # OQ-130
  passphrase_file: cosign.password       # under HMS_CELL_HOME, mode 600, only if generated (OQ-130)
  # cosign 3 writes a Sigstore bundle under the OCI referrers tag scheme. Kyverno 1.19's ImageValidatingPolicy
  # verifies it offline; its deprecated ClusterPolicy verifyImages finds no signature in it (OQ-135).
  format: cosign-3-bundle

# Memory budgets per profile, in MiB [P] (WP-0.2 plan §2.2). 'expected_mib' is the steady-state estimate that
# the footprint test (S7) measures; 'limit_mib' is the sum of the container or pod limits. 'cell lint' fails when
# the expected figures add up to more than the profile budget, or one exceeds its limit.
profiles:
  lite:
    description: three k3s servers in a 10 GB WSL VM; one Kafka broker, three PostgreSQL instances, no Argo CD (§5.1; DN-005)
    budget_mib: 6144
    components:
      k3s-servers: {count: 3, limit_mib: 9216, expected_mib: 1800, note: "k3s, etcd, containerd, kubelet, flannel; CoreDNS and local-path on one node; 3072 per node, covering its pods"}
      k3d-lb-registry: {count: 2, limit_mib: 192, expected_mib: 60, note: "load balancer 64, registry 128"}
      kyverno: {count: 1, limit_mib: 384, expected_mib: 200}
      cnpg-operator: {count: 2, limit_mib: 512, expected_mib: 200}
      postgresql: {count: 3, limit_mib: 1536, expected_mib: 600}
      strimzi-operators: {count: 2, limit_mib: 640, expected_mib: 500, note: "cluster operator 384, topic operator 256"}
      kafka: {count: 1, limit_mib: 768, expected_mib: 550}
      temporal: {count: 4, limit_mib: 768, expected_mib: 480}
      keycloak: {count: 2, limit_mib: 1152, expected_mib: 800, note: "operator 384, Keycloak 768"}
      small-services: {count: 4, limit_mib: 768, expected_mib: 270, note: "OpenFGA 128, Valkey 128, SeaweedFS 256, OpenTelemetry collector 256"}
  dev:
    description: the three-node dev cell on a 32 GB host; three Kafka brokers and Argo CD; never run on this host (KA-015)
    components:
      k3s-servers: null
      k3d-lb-registry: null
      kyverno: null
      cnpg-operator: null
      postgresql: null
      strimzi-operators: null
      kafka: null
      temporal: null
      keycloak: null
      small-services: null
      argocd: null

