# HMS Kurdistan frontend workspace (BUILD-PROMPT.md §6.1).
# Directories under apps/ and packages/ without a package.json (the README placeholders) are not projects.
packages:
  - apps/*
  - packages/*

# pnpm 11 and later read only registry and auth keys from .npmrc, so the install policy lives here.
# .npmrc repeats the first three for npm-compatible tools.
saveExact: true
engineStrict: true
strictPeerDependencies: true
# pnpm is pinned by "packageManager"; upgrades go through the version rule and ADR-002, not the notifier.
updateNotifier: false
# The package store is project-local, like the Gradle home: .tools/ is git-ignored, and installing never
# writes outside the repository. 'sh tools/bootstrap frontend' fills it.
storeDir: ../.tools/pnpm-store
# `pnpm run` fails with a clear message when node_modules does not match the lockfile, instead of running
# stale tools or installing on its own. Install first: corepack pnpm install --frozen-lockfile.
verifyDepsBeforeRun: error

# One pinned version per direct dependency (BUILD-PROMPT.md §4.1 version rule). Packages refer to these
# with "catalog:"; pnpm-lock.yaml pins the full tree. Record changes in ADR-002 and the SBOM.
