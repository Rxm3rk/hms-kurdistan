# Gradle settings for the HMS Kurdistan backend (BUILD-PROMPT §6.1, §19.1).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Never download a JDK: the JDK 25 toolchain must already be installed (§3.4 item 9).
org.gradle.java.installations.auto-download=false
kotlin.code.style=official
# The fast-tier property-test budget comes from the Gradle property hms.pbt.sequences
# (default 1000, §19.1); override it on the command line with -Phms.pbt.sequences=N.
