          - "PropertyTest:SI-21-labels-propagate-to-derived-artefacts"
      - id: CTRL-0021-6
        type: process
        risk_control_option: information
        covers: [c]
        description: >-
          Each label has its own hazard entry (HAZ-0022 to HAZ-0027) and its own property tests;
          `tools/hms safety check` fails if any SI-21 label lacks an entry.
        sources: ["§2.1 SI-21"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
