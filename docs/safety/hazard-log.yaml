  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0011
    title: Patient is transfused with the wrong blood unit
    description: >-
      A unit is given without a full wristband, unit, order and sample match and a two-person
      electronic witness, or a public blood-bank unit is relabelled wrongly at receipt, or a mismatch
      does not stop the transfusion or quarantine the unit.
    seeded_hazard: H8
    invariants: [SI-11]
    invariant_text: "Transfusion requires a wristband ↔ unit ↔ order ↔ sample match plus a two-person electronic witness; a mismatch is a hard stop. Units from public blood banks are relabelled at receipt under two-person **blind double entry** of unit number, ABO/Rh, product and expiry from the original label and the issue note. The original label is never covered; the new label prints the unit number and ABO/Rh beside the barcode; the bedside witness also confirms the unit number on the original label; any mismatch quarantines the unit. Until T2 is activated: a scripted two-person check (identifiers scanned and shown side by side, both electronic signatures required, no automated pass/fail)"
    invariant_clauses:
      - {id: a, text: "Transfusion requires a wristband ↔ unit ↔ order ↔ sample match"}
      - {id: b, text: "plus a two-person electronic witness;"}
      - {id: c, text: "a mismatch is a hard stop."}
      - {id: d, text: "Units from public blood banks are relabelled at receipt under two-person **blind double entry** of unit number, ABO/Rh, product and expiry from the original label and the issue note."}
      - {id: e, text: "The original label is never covered;"}
      - {id: f, text: "the new label prints the unit number and ABO/Rh beside the barcode;"}
      - {id: g, text: "the bedside witness also confirms the unit number on the original label;"}
      - {id: h, text: "any mismatch quarantines the unit."}
      - {id: i, text: "Until T2 is activated: a scripted two-person check (identifiers scanned and shown side by side, both electronic signatures required, no automated pass/fail)"}
    enforced_in: "Transfusion verification (T2) or fallback"
    modules: [transfusion, reg-transfusion, medications]
    features: [DX-BB-01, DX-BB-KRI-01, DX-BB-02, MED-BCM-01, DX-LAB-01, PLT-UX-02, TRU-REG-01, PLT-CORE-03]
    sac: [SAC-41]
    causes:
      - Bedside check skipped, done by one person, or done against the wrong order or sample
      - A wrong-blood-in-tube sample
      - Transcription errors when relabelling a paper-issued public blood-bank unit
      - The new label covering the original label, so the two cannot be compared
      - A mismatch noticed but the unit still issued
      - T2 not active and no structured fallback check
    effects: ABO-incompatible or otherwise wrong transfusion
    initial_risk:
      severity: catastrophic
      likelihood: occasional
      level: very-high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: §10.5 classes bedside transfusion
        verification as IEC 62304 class C; a wrong-blood transfusion can kill. Likelihood: judged
        before the controls below; units arrive on paper from public blood banks [L]; no measured
        local rate exists yet.
    controls:
      - id: CTRL-0011-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-11 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). It is vendor-locked in the
          configuration chain: a tenant may tighten it and can never loosen it.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-11-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-11"
      - id: CTRL-0011-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the blood-unit and transfusion lifecycles (short runs in the fast
          tier; nightly 10⁶ sequences plus at least 10⁴ per real channel adapter, zero violations);
          the nightly transfusion scenario suite with a mismatch injected at each step and relabel
          at receipt with blind double entry (relabel errors must be 0).
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #4", "§19.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-11-*"
          - "ScenarioSuite:transfusion"
      - id: CTRL-0011-3
        type: design
        risk_control_option: protective
        covers: [a, c]
        description: >-
          Bedside verification (T2, reg-transfusion) runs inside the BCMA flow and matches wristband,
          unit, order and sample; any identifier mismatch is a hard stop; on timeout or error the
          sidecar returns "unavailable, manual check required", never "pass".
        sources: ["§2.1 SI-11", "§5.2 (Tier 2 sidecars)", "§9.11 (bedside verification)", "§10.4", "SAC-41"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-11-wristband-unit-order-sample-match"
          - "BoundaryTest:reg-transfusion-*"
          - "AcceptanceTest:SAC-41"
      - id: CTRL-0011-4
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          The sample side of the match: samples are labelled at the bedside, with wrong-blood-in-tube
          detection by a second concordant ABO/Rh determination (historical or from a second sample,
          configurable); WBIT per 1,000 samples is reported.
        sources: ["§9.11 (the loop as timed events)", "§9.11 acceptance"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-11-sample-needs-concordant-second-determination"
          - "ScenarioSuite:transfusion"
      - id: CTRL-0011-5
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          The electronic witness needs two different authenticated people, each giving their own
          electronic signature; a unit cannot be administered without both signatures.
        sources: ["§2.1 SI-11", "§9.11 acceptance", "§13.1 IA-7 (badge + PIN for co-signature)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-11-two-different-witnesses-both-signed"
      - id: CTRL-0011-6
        type: design
        risk_control_option: design
        covers: [d]
        description: >-
          Every unit is relabelled at receipt (the safer reading of K-08 against SI-11, Q-K14
          default): two people independently enter unit number, ABO/Rh, product and expiry from the
          original label and the issue note, neither seeing the other's entry; no relabel record
          exists until both entries agree.
        sources: ["§2.1 SI-11", "§9.11 (receipt and relabel)", "A.20 (relabel scope)", "§23 Q-K14"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-11-blind-double-entry"
          - "ScenarioSuite:transfusion"
      - id: CTRL-0011-7
        type: process
        risk_control_option: information
        covers: [e]
        description: >-
          The receipt workflow places our label so that it never covers the original label, and both
          people attest in the receipt step that the original label is uncovered and readable.
        sources: ["§2.1 SI-11", "§9.11 (receipt and relabel)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:relabel-receipt-step-attests-original-label-uncovered"
      - id: CTRL-0011-8
        type: labelling
        risk_control_option: information
        covers: [f, e]
        description: >-
          The relabel template prints the unit number and ABO/Rh beside our barcode, with a size and
          layout that leave the original label uncovered.
        sources: ["§2.1 SI-11", "§9.11 (receipt and relabel)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "GoldenImage:blood-unit-relabel-*"
      - id: CTRL-0011-9
        type: design
        risk_control_option: protective
        covers: [g]
        description: >-
          The bedside witness step requires the witness to confirm the unit number read from the
          original label, in both modes. With T2 active, T2 (reg-transfusion) compares it with the
          relabel record, and a difference is a mismatch: a hard stop, and the unit is quarantined
          (CTRL-0011-10). Until T2 is activated, the scripted two-person check of §10.3 D
          (CTRL-0011-11) compares nothing and gives no automated pass/fail: the identifiers are
          scanned and shown side by side, the witness confirms the unit number on the original label
          against them, both people sign, and a mismatch that either of them finds is recorded and
          quarantines the unit (CTRL-0011-10).
        sources: ["§2.1 SI-11", "§9.11 (bedside verification; fallback until T2)", "§10.3 D (T2 fallback)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-11-witness-confirms-original-unit-number (T2)"
          - "AcceptanceTest:transfusion-scripted-fallback-witness-step-makes-no-automated-comparison"
      - id: CTRL-0011-10
        type: design
        risk_control_option: protective
        covers: [h, c]
        description: >-
          Any mismatch (between the blind entries, against the issue note, or at the bedside against
          the original label) quarantines the unit, and a quarantined unit cannot be issued or
          administered; fridge temperature excursions also quarantine units.
        sources: ["§2.1 SI-11", "§8.4 (blood unit)", "§9.11 (receipt and relabel, acceptance)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-11-any-mismatch-quarantines"
          - "PropertyTest:SI-11-quarantined-unit-never-issued-or-administered"
      - id: CTRL-0011-11
        type: design
        risk_control_option: design
        covers: [i]
        description: >-
          Until T2 is activated for the site through the Boundary Register, the scripted two-person
          check runs: identifiers scanned and shown side by side, both electronic signatures
          required, no automated pass/fail, and the witness confirms the unit number on the original
          label.
        sources: ["§2.1 SI-11", "§9.11 (fallback until T2)", "§10.3 D"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:transfusion-scripted-fallback-has-no-automated-pass-fail"
          - "ScenarioSuite:transfusion"
    residual_risk: {proposed: null, accepted_by: null}
    status: open
    owner: transfusion-squad
    cso_triage: {by: null, date: null}
    incidents: []
    releases: []

  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0012
    title: Money rules delay discharge, emergency care or a time-critical dose, or an unverified family-bought medicine is given
    description: >-
      Bill clearance, deposits or pre-authorisation block a discharge or emergency care; a payment,
      deposit or counter rule delays a verified time-critical inpatient dose; or a medicine bought by
      the family is given without pharmacy receipt and verification.
    seeded_hazard: [H4, H2]
    invariants: [SI-12]
    invariant_text: "Bill clearance, deposits and pre-authorisation never block discharge or emergency care. No payment, deposit or counter rule may delay a verified time-critical inpatient dose (STAT and first doses, antimicrobials, insulin, anticoagulants, anticonvulsants); it is charged to the running bill. Medicines bought by families are received by pharmacy (identified, expiry-checked, relabelled to the patient, flagged \"patient-supplied\"); unverified outside medicines cannot be scanned for administration"
    invariant_clauses:
      - {id: a, text: "Bill clearance, deposits and pre-authorisation never block discharge or emergency care."}
      - {id: b, text: "No payment, deposit or counter rule may delay a verified time-critical inpatient dose (STAT and first doses, antimicrobials, insulin, anticoagulants, anticonvulsants);"}
      - {id: c, text: "it is charged to the running bill."}
      - {id: d, text: "Medicines bought by families are received by pharmacy (identified, expiry-checked, relabelled to the patient, flagged \"patient-supplied\");"}
      - {id: e, text: "unverified outside medicines cannot be scanned for administration"}
    enforced_in: "RCM ↔ ADT/MAR boundary"
    modules: [rcm, adt, orders, medications, empi, ed]
    features: [OPS-FLW-01, RCM-ACC-01, RCM-CHG-01, RCM-CSH-01, RCM-INS-01, ACC-ADT-01, ACC-REG-01, CLN-ED-01, MED-MAR-01, MED-BCM-01, MED-DSP-01, MED-KRI-01]
    sac: []
    causes:
      - A clinical command that waits on an RCM state (deposit, balance, pre-approval)
      - A pay-first counter checkpoint placed in front of dispensing a time-critical dose
      - ED registration or emergency orders gated by a deposit rule
      - A family-bought medicine taken to the bedside without pharmacy receipt
    effects: Delayed emergency care or time-critical doses; patients held for payment; an unidentified or expired medicine given
    initial_risk:
      severity: catastrophic
      likelihood: probable
      level: very-high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: a delayed STAT antimicrobial,
        anticonvulsant or anticoagulant, or delayed emergency care, can kill. Likelihood: deposits,
        counter payments and family-bought medicines are routine in the target private hospitals
        (SI-12 text; §9.21 [L]); judged before the controls below.
    controls:
      - id: CTRL-0012-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-12 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). It is vendor-locked in the
          configuration chain: a tenant may tighten it and can never loosen it.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-12-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-12"
      - id: CTRL-0012-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Cross-boundary property-based tests across RCM, ADT, orders and MAR (short runs in the fast
          tier; nightly 10⁶ sequences plus at least 10⁴ per real channel adapter, zero violations);
          the nightly revenue and SI-12 scenario suite and the SI-12 extensions of the closed-loop
          medication suite.
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #3, #9", "§9.20 acceptance 4", "§19.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-12-*"
          - "ScenarioSuite:revenue-si-12"
          - "ScenarioSuite:closed-loop-medication"
      - id: CTRL-0012-3
        type: design
        risk_control_option: design
        covers: [a, b]
        description: >-
          rcm is a downstream conformist satellite: no kernel, ADT or order command calls it
          synchronously, and no RCM state can block an ADT, order, discharge or MAR command; during
          an RCM outage clinical work continues and charge events wait in the outbox.
        sources: ["§2.1 SI-12", "§5.2 (dependency rules)", "§9.20 acceptance 4", "ADR-003"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "ArchTest:no-synchronous-call-from-kernel-adt-or-orders-to-rcm"
          - "PropertyTest:SI-12-no-rcm-state-blocks-a-clinical-command"
          - "ChaosTest:rcm-outage-clinical-work-continues"
      - id: CTRL-0012-4
        type: design
