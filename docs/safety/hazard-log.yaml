      interfaces, AI grounding or analytics), or a labelled result or pregnancy test is released by
      message. Each label has its own entry (HAZ-0022 to HAZ-0027).
    seeded_hazard: H14
    invariants: [SI-21]
    invariant_text: "Sensitivity labels and purpose-of-use are enforced at the policy enforcement point for every channel: UI, API, print, exports, interfaces, AI grounding and analytics. Labels: HIV, mental health, reproductive and sexual health, gender-based violence, forensic/MLC, VIP (public figures and officials). Each label has its own hazard entry and property tests. Labelled results and pregnancy tests are never released by message"
    invariant_clauses:
      - {id: a, text: "Sensitivity labels and purpose-of-use are enforced at the policy enforcement point for every channel: UI, API, print, exports, interfaces, AI grounding and analytics."}
      - {id: b, text: "Labels: HIV, mental health, reproductive and sexual health, gender-based violence, forensic/MLC, VIP (public figures and officials)."}
      - {id: c, text: "Each label has its own hazard entry and property tests."}
      - {id: d, text: "Labelled results and pregnancy tests are never released by message"}
    enforced_in: "Trust Plane PEP; print and export services"
    modules: [trust-policy, trust-audit, platform-docs, hub, front-door, analytics, ai-gateway]
    features: [TRU-PRV-01, TRU-IAM-02, TRU-IAM-03, TRU-PRV-02, TRU-AUD-01, INT-DOC-01, INT-FHIR-01, INT-ENG-01, DFD-REC-01, DFD-MSG-01, AI-GW-01, AI-DAT-01, CLN-DOC-04]
    sac: [SAC-31]
    causes:
      - A channel (an export, an interface feed, an analytics view, AI grounding) that bypasses the policy enforcement point
      - Access without a purpose of use
      - A label not propagated to a derived document, message or print
      - A labelled result or pregnancy test offered through the report-release rule
    effects: Unlawful disclosure of sensitive information, with stigma, discrimination or danger to the patient
    initial_risk:
      severity: major
      likelihood: occasional
      level: high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: disclosure of a labelled record can
        put a patient's safety or livelihood at risk. Likelihood: judged before the controls below.
    controls:
      - id: CTRL-0021-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-21 is enforced below the API at the policy enforcement point for every channel (UI, API,
          mobile, interfaces, migration loaders, plugins and AI agents). It is vendor-locked in the
          configuration chain: a tenant may tighten it and can never loosen it.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
