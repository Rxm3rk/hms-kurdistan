  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0005
    title: Patient receives a dose error (wrong weight, missing unit, arithmetic slip or 10× or 100× error) that nobody intercepts
    description: >-
      A medication dose is derived from a stale or unsourced weight, carries no unit, is computed
      outside the Dose Engine, or deviates tenfold or more without a hard stop; or, before the Dose
      Engine is active, the extended fallback control set is not in force everywhere it must be,
      including NICU and PICU.
    seeded_hazard: H2
    invariants: [SI-05]
    invariant_text: "One dated, sourced dosing weight. UCUM units; no unit-less doses. **Dose arithmetic only in the Dose Engine** (static analysis fails the build otherwise). Hard stop at 10×/100× deviation. **The Dose Engine is P2.** Until it is active at a site, the **extended fallback control set** applies (§10.3): a system-enforced independent pharmacist double check on every weight- or BSA-based dose at any age, every high-alert infusion and every neonatal order; a drug-KB result ≥10× the maximum dose is a Tier A hard stop with the KB output shown verbatim; a pharmacist-cover alarm; review within 4 h of any dose given before verification. Core sites apply the double check at transcription. NICU and PICU go live with the rest of the site, never later"
    invariant_clauses:
      - {id: a, text: "One dated, sourced dosing weight."}
      - {id: b, text: "UCUM units; no unit-less doses."}
      - {id: c, text: "**Dose arithmetic only in the Dose Engine** (static analysis fails the build otherwise)."}
      - {id: d, text: "Hard stop at 10×/100× deviation."}
      - {id: e, text: "**The Dose Engine is P2.**"}
      - {id: f, text: "Until it is active at a site, the **extended fallback control set** applies (§10.3):"}
      - {id: g, text: "a system-enforced independent pharmacist double check on every weight- or BSA-based dose at any age, every high-alert infusion and every neonatal order;"}
      - {id: h, text: "a drug-KB result ≥10× the maximum dose is a Tier A hard stop with the KB output shown verbatim;"}
      - {id: i, text: "a pharmacist-cover alarm;"}
      - {id: j, text: "review within 4 h of any dose given before verification."}
      - {id: k, text: "Core sites apply the double check at transcription."}
      - {id: l, text: "NICU and PICU go live with the rest of the site, never later"}
    enforced_in: "Dose Engine or fallback control set; CI static analysis"
    modules: [medications, reg-dose, reg-screening, cds, record, platform-config]
    features: [MED-DOSE-01, MED-PHV-01, MED-DSP-01, MED-MAR-01, MED-INF-01, MED-FRM-01, CLN-CDS-01, CLN-CDS-02, CLN-ORD-02, CLN-CHT-01, PLT-CFG-01, IMP-RDY-01, PLT-CORE-03]
    sac: [SAC-11, SAC-12, SAC-13, SAC-24, SAC-50]
    causes:
      - Several weights recorded, or a weight with no date or source, used for a dose
      - A dose entered without a unit, or with a unit misread
      - Dose arithmetic (weight, BSA, concentration, rate, unit conversion, rounding) done outside the Dose Engine
      - A tenfold or hundredfold decimal or unit error not stopped
      - The extended fallback control set missing or switched off at a site without an active Dose Engine
      - No pharmacist in the verification queue, or a dose given before verification and never reviewed
      - A Core site transcribing paper orders without the double check
      - NICU or PICU going live after the rest of the site, outside the closed loop
    effects: Overdose or underdose; tenfold errors are lethal (§10.5)
    initial_risk:
      severity: catastrophic
      likelihood: occasional
      level: very-high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: §10.5 classes weight and BSA dose
        calculation as IEC 62304 class C because "10× errors are lethal". Likelihood: judged before
        the controls below; no measured local rate exists yet.
    controls:
      - id: CTRL-0005-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-05 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). Its parameters, including the 10×
          and 100× hard-stop thresholds and the 4-hour review, are vendor-locked in the
          configuration chain: a tenant may tighten them and can never loosen them.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-05-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-05"
      - id: CTRL-0005-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the order, verification and medication-administration state
          machines (short runs in the fast tier; nightly 10⁶ sequences plus at least 10⁴ per real
          channel adapter, zero violations); the nightly ISMP, closed-loop medication and CPOE
          error-category scenario suites.
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #1, #2, #3", "§19.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-05-*"
          - "ScenarioSuite:ismp"
          - "ScenarioSuite:closed-loop-medication"
          - "ScenarioSuite:cpoe-error-category-harness"
      - id: CTRL-0005-3
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          Each patient has one current dosing weight, recorded as a fact with the date measured and
          its source; ordering and the banner show it dated and sourced; a new weight is a new fact
          that supersedes the old one; no weight-based medicine can be signed without a dated weight.
        sources: ["§2.1 SI-05", "§9.5 (checks at ordering)", "SAC-11"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-05-one-dated-sourced-dosing-weight"
          - "PropertyTest:SI-05-no-weight-based-medicine-signed-without-dated-weight"
          - "AcceptanceTest:SAC-11"
      - id: CTRL-0005-4
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          Every quantity carries a UCUM unit in the platform Quantity type, and a unit-less dose
          cannot be built into a valid command on any channel; weights and doses are metric only.
        sources: ["§2.1 SI-05", "§6.2 (units)", "SAC-11"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "UnitTest:quantity-requires-ucum-unit"
          - "PropertyTest:SI-05-no-unitless-dose-on-any-channel"
      - id: CTRL-0005-5
        type: test
        risk_control_option: protective
        covers: [c]
        description: >-
          A custom detekt rule plus ArchUnit rules on Dose and Quantity operations encode exactly the
          §2.1 definition of dose arithmetic and fail the build on any dose arithmetic outside
          reg-dose; the allowed comparisons (a) to (e) go through one audited comparison API; the mock
          KB's arithmetic lives only in test fixtures.
        sources: ["§2.1 SI-05 and the definition of dose arithmetic", "§6.8 item 1", "§9.10 acceptance 6"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "StaticAnalysis:no-dose-arithmetic-outside-reg-dose"
          - "ArchTest:dose-and-quantity-operations-only-in-reg-dose"
          - "UnitTest:allowed-comparison-api-a-to-e"
      - id: CTRL-0005-6
        type: design
        risk_control_option: design
        covers: [c]
        description: >-
          Until reg-dose is active, the system never rounds, converts or recalculates a dose: it
          shows corrected age, displays entered and KB-returned values unchanged (NICU screens show
          the entered value and unit without rounding), and paediatric rounding is the pharmacist's
          documented decision under control set A.
        sources: ["§2.1 (dose arithmetic (a))", "§9.17 (NICU basics)", "A.20 (paediatric rounding)", "SAC-13"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:SAC-13"
          - "PropertyTest:SI-05-no-rounding-or-recalculation-before-dose-engine"
      - id: CTRL-0005-7
        type: design
        risk_control_option: protective
        covers: [d]
        description: >-
          A 10× or 100× deviation is a hard stop. Inside the Dose Engine (P2) the maximum-dose and
          10×/100× checks are calculator hard stops with boundary-value tests. Until the Dose Engine
          is active at a site, the only automated stop for such a deviation is the KB ≥10× Tier A
          rule (CTRL-0005-10), and it does not stop every 10× or 100× deviation. It compares a
          KB-returned ratio, flag or maximum in exactly the ordered unit with a governed threshold
          (§2.1 (c)), so it stops an order only when the KB returns one of these and the dose is at
          least 10× the KB maximum dose. It does not stop a 10× or 100× error that leaves the dose
          below that (a tenfold error on a dose of a fifth of the maximum comes to twice the
          maximum), or any tenfold or hundredfold underdose. Where the KB returns no ratio, flag or
          maximum, the screen shows "dose check unavailable" and the order goes to pharmacist
          review. KB dose-range screening still shows its result verbatim (§9.10), but it is not a
          hard stop. Such errors, and orders with "dose check unavailable", are left to the
          manual controls that replace the automated protection (§10.3): the pharmacist double check
          with an independently calculated dose (CTRL-0005-9) on every weight- or BSA-based dose,
          every high-alert infusion and every neonatal order; otherwise only pharmacist verification
          where the order passes through it (§9.10), which asks for no independent calculation; and,
          for a dose given under an emergency or first-dose override, only the review within 4 h
          after it (CTRL-0005-12).
        sources: ["§2.1 SI-05", "§2.1 (dose arithmetic (c))", "§10.3 (fallback principle)", "§10.3 A.1, A.2, A.4", "§9.10 (screening; pharmacist verification)", "§10.4 (reg-dose scope)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "BoundaryTest:reg-dose-10x-and-100x-hard-stop (P2)"
          - "PropertyTest:SI-05-10x-or-100x-deviation-is-a-hard-stop (Dose Engine active, P2)"
          - "PropertyTest:SI-05-before-dose-engine-kb-10x-hard-stop-or-pharmacist-review"
        notes: >-
          Remaining gap of control set A, open for the CSO [HUMAN] (docs/safety/README.md, open
          question 9; docs/program/OPEN-QUESTIONS.md, OQ-120): before the Dose Engine, a 10× or
          100× error below 10× the KB maximum, a tenfold or hundredfold underdose, and an order for
          which the KB returns no ratio, flag or maximum get no automated hard stop. This control
          does not count clause d as covered for them before the Dose Engine; it records the manual
          controls above, which SI-05 and §10.3 A put in its place, and the CSO decides whether they
          are enough until P2.
      - id: CTRL-0005-8
        type: design
        risk_control_option: design
        covers: [e, f]
        description: >-
          reg-dose is P2 and absent from the MVP. It activates at a site only through the Boundary
          Register (SI-18) as a C2 change after at least 4 weeks of shadow running visible only to
          pharmacists, and the NICU double check stays for 3 months after activation. While reg-dose
          is not active at a site, the extended fallback control set (§10.3 A) is in force for that
          site and no configuration can switch it off. Dose-range checks show their working before
          submission in full from Dose Engine activation; control set A applies until then.
        sources: ["§2.1 SI-05", "§10.3 A", "§10.4 (reg-dose)", "§19.3 C2", "SAC-12"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-05-fallback-set-a-in-force-while-dose-engine-inactive"
          - "AcceptanceTest:SAC-12"
      - id: CTRL-0005-9
        type: design
        risk_control_option: protective
        covers: [g]
        description: >-
          Pharmacist verification of every weight- or BSA-based dose at any age, every high-alert
          infusion and every neonatal order cannot complete until the pharmacist records an
          independently calculated dose and attests that it matches the order. The system performs
          no arithmetic: the match is an exact comparison of two independently entered quantities in
          the same UCUM unit, a unit mismatch counts as a mismatch, and a mismatch returns the order
          to the prescriber.
        sources: ["§2.1 SI-05", "§2.1 (dose arithmetic (b))", "§10.3 A.1", "§9.10 acceptance 2"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-05-double-check-required-for-weight-bsa-high-alert-infusion-neonatal"
          - "AcceptanceTest:control-set-a-verification-needs-independent-dose-and-attestation"
      - id: CTRL-0005-10
        type: design
        risk_control_option: protective
        covers: [h, d]
        description: >-
          A drug-KB result of 10× or more of the maximum dose is a Tier A hard stop with the KB output
          shown verbatim. The comparison uses only a KB-returned ratio, flag or maximum in exactly the
          ordered unit against a governed threshold; if the KB returns none of these, the screen shows
          "dose check unavailable" and the order goes to pharmacist review. The screening presenter
          never alters KB output.
        sources: ["§2.1 SI-05", "§2.1 (dose arithmetic (c))", "§10.3 A.2", "§9.6 acceptance"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-05-kb-10x-maximum-is-tier-a-hard-stop"
          - "BoundaryTest:reg-screening-output-verbatim"
          - "UnitTest:dose-check-unavailable-goes-to-pharmacist-review"
      - id: CTRL-0005-11
        type: design
        risk_control_option: protective
        covers: [i]
        description: >-
          An alarm fires when no pharmacist has been logged in to the verification queue for more
          than 30 minutes.
        sources: ["§2.1 SI-05", "§10.3 A.4", "§18.13 RG3 (pharmacist-cover alarm tested)", "SAC-24"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "ScenarioTest:pharmacist-cover-alarm-after-30-minutes (simulated clock)"
          - "AcceptanceTest:SAC-24"
      - id: CTRL-0005-12
        type: design
        risk_control_option: protective
        covers: [j]
        description: >-
          Any dose given before verification creates an owned pharmacist review task due within
          4 hours, escalated and orphan-alarmed like every task (SI-03).
        sources: ["§2.1 SI-05", "§10.3 A.4", "§9.10 (pharmacist verification)", "SAC-24"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-05-review-task-within-4h-of-dose-before-verification"
          - "AcceptanceTest:SAC-24"
      - id: CTRL-0005-13
        type: design
        risk_control_option: design
        covers: [k]
        description: >-
          At Core sites the double check of control set A is applied at pharmacist transcription,
          with drug-KB allergy, interaction and dose screening at transcription (control set B); no
          MAR, schedule or active-medicines view is built from transcribed orders.
        sources: ["§2.1 SI-05", "§10.3 A.5", "§10.3 B", "§9.10 acceptance 3"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:control-set-b-double-check-at-transcription"
          - "E2E:core-site-shows-no-mar-from-transcriptions (UI and API)"
      - id: CTRL-0005-14
        type: design
        risk_control_option: design
        covers: [l]
        description: >-
          The facility-level clinical tier CLINICAL_SAFETY is one locked setting that switches CPOE,
          pharmacist verification, eMAR/BCMA and transfusion verification on together for every
          inpatient area of the facility, NICU and PICU included; no configuration state can leave
          NICU or PICU outside the closed loop or activate them later.
        sources: ["§2.1 SI-05", "§6.6 (clinical tier, K-24)", "§9.10 (rollout is site-wide only)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:clinical-tier-has-no-partial-loop (NICU and PICU included)"
      - id: CTRL-0005-15
        type: process
        risk_control_option: information
        covers: [l, g, i]
        description: >-
          Go-live readiness evidence lists NICU and PICU in the same go-live as the rest of the site;
          at RG3, control set A is validated for NICU, PICU and paediatrics and signed by the Chief
          CSO [HUMAN], and the pharmacist-cover alarm is tested; 24×7 pharmacist cover is an RG1
          obligation at Clinical Safety sites [HUMAN].
        sources: ["§10.3 A.6", "§18.13 RG1 and RG3", "IMP-RDY-01"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "ReadinessCheck:rg3-control-set-a-nicu-picu [HUMAN sign-off]"
          - "ReadinessCheck:rg1-pharmacist-cover [HUMAN]"
      - id: CTRL-0005-16
        type: test
        risk_control_option: protective
        covers: [d, h, g]
        description: >-
          Seeded adult and paediatric 10× and unit errors ship as test assets and run in every
          integrated test cycle; every one must be stopped. Before the Dose Engine, what stops a
          seeded error that neither the KB ≥10× rule (CTRL-0005-10) nor the double check
          (CTRL-0005-9) reaches, and whether the seeded set must hold such errors, is open for the
          CSO [HUMAN] (CTRL-0005-7; docs/safety/README.md, open question 9;
          docs/program/OPEN-QUESTIONS.md, OQ-120).
        sources: ["§10.3 A.3", "§18.5 #2", "§9.10 acceptance 2"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "ScenarioSuite:ismp (seeded 10× and unit errors)"
          - "ScenarioSuite:closed-loop-medication"
      - id: CTRL-0005-17
        type: labelling
        risk_control_option: information
        covers: [b]
        description: >-
          Doses display under ISMP rules (leading zero, no trailing zeros, no naked decimals) with
          tall-man lettering for look-alike names, on screens and prints, in every locale with
          Western digits.
        sources: ["§2.1 (also carried as acceptance criteria)", "§6.5", "§9.10 (formulary)", "SAC-50"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "UnitTest:clinical-number-ismp-display-rules"
          - "AcceptanceTest:SAC-50"
