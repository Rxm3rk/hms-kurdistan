  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0018
    title: A regulated (Tier 2) function runs for a tenant without clearance and current written evidence, so patients rely on an unapproved function
    description: >-
      A Tier 2 function (for example the Dose Engine, early-warning scores, transfusion verification,
      the screening presenter or LIS autoverification) is switched on where the Regulatory Boundary
      Register does not say "cleared" or "not required", without a stored, current written local
      opinion, or by a configuration toggle.
    seeded_hazard: null
    seeded_hazard_note: >-
      The §2.1 table maps SI-18 to no seeded hazard ("—"), so this entry keeps seeded_hazard null
      rather than reinterpret the table. The patient harms of an uncleared activation are those of the
      function itself: H2 (reg-dose, reg-screening), H3 (reg-lis-rules), H4 (reg-ews) and H8
      (reg-transfusion), listed in related_seeded_hazards as a proposal. Whether to map SI-18 to these
      or to add a new seeded hazard is a CSO triage question [HUMAN].
    related_seeded_hazards: [H2, H3, H4, H8]
    invariants: [SI-18]
    invariant_text: "A Tier 2 function activates for a tenant only where the Regulatory Boundary Register says \"cleared\" or \"not required\", backed by a stored written local opinion (scope, intended purpose, version, jurisdiction; expires after 24 months or on any change). Configuration toggles cannot override it"
    invariant_clauses:
      - {id: a, text: "A Tier 2 function activates for a tenant only where the Regulatory Boundary Register says \"cleared\" or \"not required\","}
      - {id: b, text: "backed by a stored written local opinion (scope, intended purpose, version, jurisdiction;"}
      - {id: c, text: "expires after 24 months or on any change)."}
      - {id: d, text: "Configuration toggles cannot override it"}
    enforced_in: "Boundary Register service"
    modules: [safety-registry, platform-config]
    features: [TRU-REG-01, TRU-REG-02, PLT-CFG-01, MED-DOSE-01, CLN-CDS-02, CLN-CDS-05, CLN-CDS-06, CLN-CDS-08, DX-BB-01, DX-LAB-03, DX-PAC-01, NUR-FLW-02]
    sac: [SAC-34, SAC-35]
    causes:
      - A flag or configuration value that enables a Tier 2 function without asking the Register
      - A Register entry marked cleared without a stored opinion, or with an opinion for another version, purpose or jurisdiction
      - An expired or withdrawn opinion that leaves the function running
    effects: Patients rely on a regulated function without lawful clearance or validated evidence; the fallback control set is not in force
    initial_risk:
      severity: catastrophic
      likelihood: remote
      level: high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: the worst Tier 2 function in scope
        (the Dose Engine) is IEC 62304 class C (§10.5). Likelihood: activation is a deliberate act, so
        an uncleared activation is judged remote before the controls below.
    controls:
      - id: CTRL-0018-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-18 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). Tier 2 activation is vendor-locked in
          the configuration chain: a tenant may tighten it and can never loosen it.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6 (Tier 2 activation is vendor-locked)", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-18-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-18"
      - id: CTRL-0018-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the Register entry lifecycle and on activation through every
          configuration layer (short runs in the fast tier; nightly 10⁶ sequences plus at least 10⁴
          sequences through each real channel adapter, zero violations); the nightly deterioration
          suite (PEWS and MEOWS only where the Register allows) and a boundary-register scenario
          suite (proposed; §18.5 names no suite dedicated to SI-18, and its #8 exercises only PEWS
          and MEOWS running where the Register allows).
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #8"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-18-*"
          - "ScenarioSuite:deterioration"
          - "ScenarioSuite:boundary-register (proposed)"
      - id: CTRL-0018-3
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          The flag service asks the Register before enabling any Tier 2 function, and enables it only
          where the entry for that tenant, function, version and jurisdiction has status "cleared" or
          "not-required"; for "not-assessed", "required" or "withdrawn" the fallback control set stays
          in force.
        sources: ["§2.1 SI-18", "§10.2 (entry, mechanics)", "ADR-016"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-18-activation-only-when-cleared-or-not-required"
      - id: CTRL-0018-4
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          A Register entry cannot reach "cleared" or "not-required" without a stored written local
          opinion (or the registration itself) that records scope, intended purpose, version and
          jurisdiction; the further K-05 evidence (safety case, the hospital's clinical-governance
          sign-off, independent-assessor concurrence where required, product-liability insurance) is
          recorded only from human sign-off records [HUMAN].
        sources: ["§2.1 SI-18", "§10.2 (evidence for activation, K-05)", "§3.5"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "UnitTest:register-entry-needs-stored-written-opinion"
          - "IntegrationTest:register-evidence-fields-only-from-sign-off-records"
      - id: CTRL-0018-5
        type: design
        risk_control_option: protective
        covers: [c]
        description: >-
          The opinion expires 24 months after its date or on any change (function version, intended
          purpose, scope or jurisdiction); expiry or withdrawal reverts the site to the fallback
          control set and raises tasks.
        sources: ["§2.1 SI-18", "§10.2 (mechanics)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-18-opinion-expires-after-24-months (simulated clock)"
          - "PropertyTest:SI-18-any-change-expires-the-opinion"
      - id: CTRL-0018-6
        type: design
        risk_control_option: design
        covers: [d]
        description: >-
          No configuration layer (vendor foundation, Kurdistan pack, tenant, legal entity, facility,
          department, unit, user) or feature flag can enable a Tier 2 function; the Register is the
          only activation switch, and activation is a C2 change.
        sources: ["§2.1 SI-18", "§6.6", "§10.2 (mechanics)", "§19.3 C2", "ADR-016"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-18-configuration-toggle-cannot-override-register"
          - "ArchTest:tier-2-activation-only-through-register"
      - id: CTRL-0018-7
        type: process
        risk_control_option: information
        covers: [a]
        description: >-
          The Register is seeded with every Tier 2 function and the sweep candidates (VTE prompts,
          Braden and Morse care-plan triggers, the critical-result escalation chain, NEWS2 frequency
          scheduling, the imaging viewer); opinions and status changes come from humans [HUMAN].
        sources: ["§10.2 (seed the Register)", "§21 WP-0.9"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "RegisterTest:seeded-with-every-tier-2-function-and-sweep-candidate"
      - id: CTRL-0018-8
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          NEWS2, PEWS and MEOWS run only where the Register allows, and observation frequency is driven
          by the score only if the Register entry covers it; until then the nurse sets frequency (the
          §10.3 D fallback).
        sources: ["§9.6 (NEWS2/PEWS/MEOWS)", "§10.3 D", "SAC-34", "SAC-35"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:SAC-34"
          - "AcceptanceTest:SAC-35"
    residual_risk: {proposed: null, accepted_by: null}
    status: open
    owner: safety-registry-squad
    cso_triage: {by: null, date: null}
    incidents: []
    releases: []

  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0019
    title: A faulty rule or clinical behaviour keeps harming patients because it cannot be switched off, or a safety-relevant change goes live by default
    description: >-
      A CDS rule or clinical-behaviour flag has no kill switch, so a fault cannot be stopped without a
      deploy, or a safety-relevant change is on by default before it has been reviewed.
    seeded_hazard: H4
    invariants: [SI-19]
    invariant_text: "Every CDS rule and clinical-behaviour flag has a kill switch. Safety-relevant changes default to off"
    invariant_clauses:
