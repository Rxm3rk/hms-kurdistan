      - id: CTRL-0009-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the medication-reconciliation lifecycle (short runs in the fast
          tier; nightly 10⁶ sequences plus at least 10⁴ per real channel adapter, zero violations);
          the nightly seam suite (medication list as reconciliation input only) and a
          medication-reconciliation scenario suite (proposed; §18.5 names no suite dedicated to SI-09,
          and its #10 exercises only the medication list as reconciliation input).
        sources: ["§2.1 (preamble)", "§8.4 (medication reconciliation)", "§18.3", "§18.5 #10"]
