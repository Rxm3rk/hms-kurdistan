  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0013
    title: A high-alert medicine error is given without a second person catching it
    description: >-
      A high-alert medication is administered without a documented independent double check, so an
      error in drug, dose, rate or patient is not intercepted.
    seeded_hazard: H2
    invariants: [SI-13]
    invariant_text: "High-alert medications require a documented independent double check"
    invariant_clauses:
      - {id: a, text: "High-alert medications require a documented independent double check"}
    enforced_in: "MAR; formulary"
    modules: [medications]
    features: [MED-MAR-01, MED-FRM-01, MED-BCM-01, MED-INF-01, MED-PHV-01, PLT-UX-04]
    sac: [SAC-22]
    causes:
      - High-alert flag missing from the formulary item
      - The second check done by the same person, or recorded as a click without a second person
      - The double check skipped on an override, offline or mobile path
    effects: High-alert medicine error reaches the patient
    initial_risk:
      severity: catastrophic
      likelihood: occasional
      level: very-high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: errors with high-alert medicines
        can kill. Likelihood: judged before the controls below; no measured local rate exists yet.
    controls:
      - id: CTRL-0013-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-13 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). It is vendor-locked in the
          configuration chain: a tenant may tighten it and can never loosen it.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-13-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-13"
      - id: CTRL-0013-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the medication-administration state machine (short runs in the fast
          tier; nightly 10⁶ sequences plus at least 10⁴ per real channel adapter, zero violations);
          the nightly closed-loop medication and ISMP scenario suites (insulin and heparin protocols).
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #2, #3", "§9.10 acceptance 1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-13-*"
          - "ScenarioSuite:closed-loop-medication"
          - "ScenarioSuite:ismp"
      - id: CTRL-0013-3
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          The formulary high-alert flag drives the MAR guard highAlertCheckSatisfied: a high-alert
          administration cannot be documented without a recorded double check by a second, different
          authenticated person (badge and PIN), on every channel including mobile, offline and
          override paths. The high-alert list is governed content [HUMAN]; synthetic samples are
          marked NOT FOR CLINICAL USE.
        sources: ["§2.1 SI-13", "§8.4 (medication administration)", "Appendix B.3", "§3.4 item 3", "SAC-22"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-13-high-alert-administration-needs-documented-independent-double-check"
          - "AcceptanceTest:SAC-22"
      - id: CTRL-0013-4
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          The second person records their own check; the system never marks a double check complete
          from the actions of one person, and the record keeps both identities and times.
        sources: ["§2.1 SI-13", "§13.1 IA-7"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-13-double-check-needs-two-different-people"
      - id: CTRL-0013-5
        type: process
        risk_control_option: information
        covers: [a]
        description: >-
          Double-check completion is a safety-dashboard KPI (JCI IPSG.3 evidence).
        sources: ["§9.29 (safety dashboard, JCI traceability)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "IntegrationTest:double-check-completion-kpi"
