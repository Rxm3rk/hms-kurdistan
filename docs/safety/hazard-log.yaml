  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0014
    title: Decision support fails the clinician, because alert fatigue hides a real warning or an ungoverned hard stop delays care
    description: >-
      Hard stops come from rules nobody governs, interruptive rules have no owner, evidence, measured
      PPV or review date, the validated baseline is not interruptive at go-live, new rules interrupt
      before being measured, or core rules are retired because clinicians override them.
    seeded_hazard: H4
    invariants: [SI-14]
    invariant_text: "Hard stops come only from a governed list. Every interruptive rule has an owner, evidence, a measured PPV and a review-by date. The vendor-validated go-live baseline (Tier A/B) is interruptive from day 0. New or locally modified rules run silent first. Tier A/B rules are never retired on override rate alone"
    invariant_clauses:
      - {id: a, text: "Hard stops come only from a governed list."}
      - {id: b, text: "Every interruptive rule has an owner, evidence, a measured PPV and a review-by date."}
      - {id: c, text: "The vendor-validated go-live baseline (Tier A/B) is interruptive from day 0."}
      - {id: d, text: "New or locally modified rules run silent first."}
      - {id: e, text: "Tier A/B rules are never retired on override rate alone"}
    enforced_in: "CDS registry"
    modules: [cds, reg-screening, content]
    features: [CLN-CDS-01, CLN-CDS-02, CLN-CDS-03, PLT-CORE-06, PLT-CFG-01, IMP-FND-01]
    sac: [SAC-14, SAC-15, SAC-16]
    causes:
      - A rule promoted to a hard stop outside the governed list
      - Interruptive rules without owner, evidence, PPV or review date accumulate
      - The baseline running silent at go-live, so serious errors are not caught on day 0
      - A new or modified rule interrupting before its firing rate and PPV are known
      - A Tier A/B rule retired because it is often overridden
    effects: Missed warnings or unnecessary interruptions that delay care
    initial_risk:
      severity: major
      likelihood: occasional
      level: high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: a missed interaction or dose
        warning can cause permanent harm, and over-alerting is as unsafe as a missed alert (§18,
        R15 §11 #10). Likelihood: judged before the controls below.
    controls:
      - id: CTRL-0014-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-14 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). It is vendor-locked in the
          configuration chain: a tenant may tighten it and can never loosen it.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-14-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-14"
      - id: CTRL-0014-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the CDS rule lifecycle (short runs in the fast tier; nightly 10⁶
          sequences plus at least 10⁴ per real channel adapter, zero violations); the nightly CPOE
          error-category harness.
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #1", "§19.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-14-*"
          - "ScenarioSuite:cpoe-error-category-harness"
      - id: CTRL-0014-3
        type: design
        risk_control_option: protective
        covers: [a]
        description: >-
          Tier A hard stops come only from the governed list in the CDS registry (budget at most 20
          rules); the rule runtime refuses to raise a hard stop for a rule not on the list. The list
          is versioned governed content [HUMAN].
        sources: ["§2.1 SI-14", "§9.6 (the minimal interruptive set)", "§14.3", "SAC-14"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-14-hard-stop-only-from-governed-list"
          - "AcceptanceTest:SAC-14"
      - id: CTRL-0014-4
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          The CDS registry gate enforces all four requirements of SI-14, "Every interruptive rule has
          an owner, evidence, a measured PPV and a review-by date.": a rule that lacks any one of the
          four cannot be interruptive. The registry holds them for every rule, with firing,
          acceptance and override rates and override reasons recorded per rule, and an overdue
          review-by date raises an owned task. Until the CSO answers DN-014, the gate takes the
          stricter interim reading: a rule without a measured PPV is not interruptive, and the
          vendor's validation of the go-live baseline does not count as one. A baseline rule (Tier
          A/B) with no measured PPV yet becomes interruptive only under an explicit exception for
          that rule that a human has approved, recorded only from a human sign-off record (§3.5)
          [HUMAN]; the agent never records one, and the gate grants none by itself.
        sources: ["§2.1 SI-14", "§9.6 (the CDS registry)", "§14.3", "§3.5", "SAC-16"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "UnitTest:cds-registry-requires-owner-evidence-ppv-review-date"
          - "PropertyTest:SI-14-rule-without-measured-ppv-never-interruptive"
          - "PropertyTest:SI-14-baseline-exception-only-from-sign-off-record"
          - "AcceptanceTest:SAC-16"
        notes: >-
          Interim reading until the CSO rules on DN-014 (docs/program/DECISIONS-NEEDED.md). Only
          its strict reading of "a measured PPV" is recorded as a tightening [P] (§3.4 item 1): the
          vendor's validation of the baseline does not count as one, and a rule without one is not
          interruptive. The exception path is not part of the tightening: a baseline rule that
          interrupts from day 0 under a human-approved exception is DN-014's option 1, a reading of
          clause b against clause c that only the CSO can choose; until the CSO decides, no
          exception exists, and CTRL-0014-5 blocks the go-live bundle. Neither part of clause b is
          dropped to make room for clause c.
      - id: CTRL-0014-5
        type: design
        risk_control_option: design
        covers: [c]
        description: >-
          The vendor-validated go-live baseline (Tier A/B) ships interruptive from day 0 in the
          go-live bundle, with no silent period. Each baseline rule passes the registry gate of
          CTRL-0014-4 like every interruptive rule: until local telemetry measures its PPV, it needs
          the human-approved exception (DN-014). Promotion of a go-live bundle is blocked while any
          baseline rule has neither a measured PPV nor that exception, so neither clause b nor
          clause c is given up to let the other pass; the conflict goes to the CSO [HUMAN].
        sources: ["§2.1 SI-14", "§9.6 (rollout)", "§14.3", "§19.4 (validated before promotion)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:vendor-baseline-interruptive-from-day-0"
          - "PromotionGate:go-live-bundle-blocked-while-a-baseline-rule-has-neither-ppv-nor-exception"
        notes: >-
          Tightening [P] (§3.4 item 1): the promotion block is this build's proposal; §19.4 validates
          content bundles before promotion but names no such rule. It keeps clauses b and c both in
          force until the CSO rules on DN-014; the CSO confirms or changes it [HUMAN].
      - id: CTRL-0014-6
        type: design
        risk_control_option: design
        covers: [d]
        description: >-
          New or locally modified rules start in silent mode for 2 to 4 weeks, followed by replay
          against up to 90 days of orders where electronic orders exist; the silent run and the
          replay measure firing rate, PPV and overlap (§18.11). Only then can the rule become
          interruptive: promotion is a governed change and passes the registry gate of CTRL-0014-4
          with the PPV measured there.
        sources: ["§2.1 SI-14", "§9.6 (rollout)", "§18.11 (CDS rule)", "§19.4 (CDS rules)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-14-new-or-modified-rule-starts-silent"
          - "PropertyTest:SI-14-promotion-to-interruptive-needs-ppv-from-silent-run-or-replay"
      - id: CTRL-0014-7
        type: design
        risk_control_option: design
        covers: [e]
        description: >-
          Rules overridden more than 90% of the time are reviewed and never auto-retired; Tier A/B
          rules are exempt from retirement on override rate, and retiring one needs a governed
          decision with evidence beyond its override rate.
        sources: ["§2.1 SI-14", "§9.6 (rollout)", "§14.3"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "UnitTest:tier-a-b-never-retired-on-override-rate-alone"
      - id: CTRL-0014-8
        type: test
        risk_control_option: protective
        covers: [a, b]
        description: >-
          The CPOE error-category harness (eight Leapfrog-style categories, unofficial) runs after
          every KB or CDS change, with the excessive-alert suppression list as versioned content. Its
          threshold applies only with the licensed KB and CSO-approved scenarios [HUMAN]; mock-KB runs
          are recorded as "mock-KB run, not clinical evidence".
        sources: ["§18.5 #1", "§14.3", "SAC-14", "SAC-15"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "ScenarioSuite:cpoe-error-category-harness"
          - "AcceptanceTest:SAC-15"
      - id: CTRL-0014-9
        type: process
        risk_control_option: information
        covers: [b]
        description: >-
          Alert-burden budgets are measured (Tier B at most 8 interruptive alerts per 100 medication
          orders at go-live and at most 5 by month 12) with quarterly alert-burden reports.
        sources: ["§9.6", "§14.3"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "IntegrationTest:alert-burden-report"
    residual_risk: {proposed: null, accepted_by: null}
    status: open
    owner: cds-squad
    cso_triage: {by: null, date: null}
    incidents: []
    releases: []

  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0015
    title: An unsafe clinical action is taken while disconnected, or clinical state is lost or overwritten when devices resync
    description: >-
      While a device, edge agent or site has lost the on-site cell, prescribing runs without full
      CDS, beds or theatres are double-allocated, identifiers are invented, controlled drugs move
      untracked or identities are merged; or offline commands are accepted without server
      revalidation or merged last-writer-wins.
    seeded_hazard: [H2, H6]
    invariants: [SI-15]
    invariant_text: "Offline: no new prescribing without full CDS, no bed or OT allocation, no identifiers outside pre-allocated blocks, no controlled-drug stock movement, no identity merges. Offline commands are revalidated by the server. No last-writer-wins or CRDT merges on clinical state. **Losing the internet does not make an on-site cell \"offline\":** this rule governs losing the on-site cell itself, edge-agent mode and mobile offline mode"
    invariant_clauses:
      - {id: a, text: "Offline: no new prescribing without full CDS,"}
      - {id: b, text: "no bed or OT allocation,"}
      - {id: c, text: "no identifiers outside pre-allocated blocks,"}
      - {id: d, text: "no controlled-drug stock movement,"}
      - {id: e, text: "no identity merges."}
      - {id: f, text: "Offline commands are revalidated by the server."}
      - {id: g, text: "No last-writer-wins or CRDT merges on clinical state."}
      - {id: h, text: "**Losing the internet does not make an on-site cell \"offline\":** this rule governs losing the on-site cell itself, edge-agent mode and mobile offline mode"}
    enforced_in: "Offline matrix; command handler"
    modules: [platform-site, orders, medications, adt, empi, platform-journal]
    features: [PLT-UX-04, MED-BCM-01, TRU-BCP-01, TRU-BCP-02, TRU-BCP-03, PLT-EDGE-01, PLT-SITE-01, CLN-ORD-02, CLN-CDS-02, ACC-ADT-02, SPC-OT-01, MED-CS-01, ACC-ID-01, ACC-ID-03, PLT-CORE-03]
    sac: [SAC-06, SAC-47]
    causes:
      - A mobile device or edge agent accepting commands that need the cell (prescribing, allocation, merges, controlled drugs)
      - Identifiers generated locally outside a pre-allocated block, colliding later
      - Offline commands applied on reconnect without revalidation, or merged last-writer-wins
      - A hospital treating an internet cut as "offline" and dropping clinical controls
    effects: Unchecked prescribing, double allocation, duplicate identities, untracked controlled drugs, wrong merges or lost clinical facts
    initial_risk:
      severity: major
      likelihood: occasional
      level: high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Follows the Appendix B.2 example for
        offline administration (major, occasional, high). Losing the on-site cell is rare; mobile
        offline is not; judged before the controls below.
    controls:
      - id: CTRL-0015-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-15 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). It is vendor-locked in the
          configuration chain: a tenant may tighten it and can never loosen it.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-15-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-15"
      - id: CTRL-0015-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests with offline-BCMA conflict replays, out-of-order and duplicate events
          (short runs in the fast tier; nightly 10⁶ sequences plus at least 10⁴ per real channel
          adapter including mobile sync, zero violations); the nightly downtime suite and the offline
          parts of the closed-loop medication suite.
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #3, #7", "§19.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-15-*"
          - "ScenarioSuite:downtime"
          - "ScenarioSuite:closed-loop-medication"
      - id: CTRL-0015-3
        type: design
        risk_control_option: design
        covers: [h]
        description: >-
          The offline and downtime safety matrix (ADR-012) is data: it lists, for each offline mode
          (on-site cell lost, edge-agent mode, mobile offline), the commands allowed. Every command
          handler consults the current mode. Internet or WAN loss alone never changes a hospital
          cell's mode, so it has no clinical effect.
        sources: ["§2.1 SI-15", "ADR-012", "§16.3 (L1, never offline)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "ChaosTest:wan-cut-hospital-cell-has-no-clinical-effect"
          - "ChaosTest:cell-loss-applies-offline-matrix"
          - "ConflictSuite:offline-matrix-s9-k"
      - id: CTRL-0015-4
        type: design
        risk_control_option: protective
        covers: [a]
        description: >-
          New prescribing is refused in any offline mode that lacks full CDS.
        sources: ["§2.1 SI-15", "§15", "§16.3 (never offline)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-15-no-new-prescribing-without-full-cds-offline"
      - id: CTRL-0015-5
        type: design
        risk_control_option: protective
        covers: [b]
        description: >-
          Bed and OT-slot allocation are refused offline (the bed machine has no reserved or assigned
          transition offline).
        sources: ["§2.1 SI-15", "§8.4 (encounter, bed)", "§9.15 (no OT allocation offline)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-15-no-bed-or-ot-allocation-offline"
      - id: CTRL-0015-6
        type: design
        risk_control_option: protective
        covers: [c]
        description: >-
          Offline, MRNs, encounter and accession numbers come only from pre-allocated, site-prefixed
          downtime blocks; offline registrations go to a reconciliation queue; nothing generates an
          identifier outside a block.
        sources: ["§2.1 SI-15", "§5.3 (downtime numbers)", "§15", "TRU-BCP-02", "SAC-06"]
        state: planned
        implemented_in: []
