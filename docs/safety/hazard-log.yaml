hazards:

  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0001
    title: Patient harmed by an action, label, wristband, MAR entry or print applied to the wrong patient
    description: >-
      A patient-affecting action, label, wristband, MAR entry or print does not carry two
      identifiers that every reader can check, or identifies the patient by room or bed, so care,
      specimens, medicines, blood or documents reach or are filed against the wrong person.
    seeded_hazard: H1
    invariants: [SI-01]
    invariant_text: "At least two identifiers on every patient-affecting action, label, wristband, MAR entry and print; never room or bed. The name prints in the patient's script plus a Latin transliteration. The second identifier is the MRN (with check digit) plus date of birth, or the approximate-DOB flag"
    invariant_clauses:
      - {id: a, text: "At least two identifiers on every patient-affecting action, label, wristband, MAR entry and print;"}
      - {id: b, text: "never room or bed."}
      - {id: c, text: "The name prints in the patient's script plus a Latin transliteration."}
      - {id: d, text: "The second identifier is the MRN (with check digit) plus date of birth, or the approximate-DOB flag"}
    enforced_in: "Identity service; print templates"
    modules: [empi, platform-docs, platform-i18n]
    features: [ACC-ID-01, ACC-ID-03, ACC-REG-01, KRI-ID-01, CLN-CHT-01, PLT-UX-02, PLT-UX-03, KRI-LOC-01, INT-DOC-01, MED-MAR-01, MED-BCM-01, DX-LAB-01, TRU-BCP-02, PLT-CORE-03]
    sac: [SAC-01, SAC-03, SAC-04]
    causes:
      - A command, label or print identifies the patient by one identifier only
      - Room, bed or location used as an identifier while patients move between beds
      - The name shown in one script only, so a reader of another script cannot check it
      - An MRN mistyped or misread that is not caught because it has no check digit
      - An estimated date of birth shown as if it were exact and trusted as a matching identifier
      - Downtime wristbands and labels produced outside the normal print path without both identifiers
    effects: Treatment, medicines, specimens, blood or documents applied to or filed against the wrong patient
    initial_risk:
      severity: catastrophic
      likelihood: occasional
      level: very-high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: a wrong-patient administration,
        transfusion or procedure can kill. Likelihood: judged before the controls below for a busy
        trilingual hospital with patients moving between beds; no measured local rate exists yet.
    controls:
      - id: CTRL-0001-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-01 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). Its parameters are vendor-locked in
          the configuration chain: a tenant may tighten them and can never loosen them.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-01-channels-* (the same property through every channel adapter, §18.3)"
          - "PropertyTest:config-chain-vendor-lock-SI-01 (a tenant setting that loosens SI-01 is refused)"
      - id: CTRL-0001-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on every state machine SI-01 touches: short runs in the fast tier;
          nightly 10⁶ randomised command sequences at the application-command layer plus at least
          10⁴ through each real channel adapter, with zero violations as a hard gate; the nightly
          identity, closed-loop medication and transfusion scenario suites. A violation is a Sev-1
          safety defect with its own hazard-log entry.
        sources: ["§2.1 (preamble)", "§18.1", "§18.3", "§18.5 #3, #4, #6", "§19.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-01-*"
          - "ScenarioSuite:identity"
          - "ScenarioSuite:closed-loop-medication"
          - "ScenarioSuite:transfusion"
      - id: CTRL-0001-3
        type: design
        risk_control_option: design
        covers: [a, d]
        description: >-
          Every patient-affecting command (for example order sign, administration, specimen
          collection, transfusion check, result filing) and every label, wristband, MAR entry and
          print job carries a patient-identity confirmation with two identifiers: the name and, as
          the second identifier, the MRN with a valid check digit plus the date of birth, or the
          approximate-DOB flag. The domain rejects a command or print job that lacks either one.
        sources: ["§2.1 SI-01", "§8.4 (medication administration guard)", "SAC-01"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-01-two-identifiers-on-every-patient-affecting-command"
          - "AcceptanceTest:SAC-01"
      - id: CTRL-0001-4
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          Room, bed and location are never accepted as identifiers: the identity-confirmation type
          has no location field, and a location value can never satisfy an identifier check on any
          channel, including a bed-label scan.
        sources: ["§2.1 SI-01", "SAC-01"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-01-location-never-an-identifier"
          - "UnitTest:identity-confirmation-has-no-location"
      - id: CTRL-0001-5
        type: labelling
        risk_control_option: information
        covers: [a, b, c, d]
        description: >-
          Print templates for labels, wristbands, specimen labels, MAR prints and documents have
          fixed identifier slots: the name in the patient's script plus a Latin transliteration, and
          the MRN with check digit plus the date of birth or the approximate-DOB flag, beside the
          barcode. Room and bed never occupy an identifier slot. A template linter rejects any
          clinical template that lacks a slot. Kurdish and Arabic text uses shaping or the raster
          fallback.
        sources: ["§2.1 SI-01", "§9.1 (wristbands and labels)", "§12.8", "SAC-01", "SAC-04"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "TemplateLint:identifier-slots-on-clinical-templates"
          - "GoldenImage:wristband-* (three scripts, long-name and newborn truncation cases, §9.1)"
          - "GoldenImage:specimen-label-*"
          - "AcceptanceTest:SAC-04"
        notes: >-
          Tightening [P] (§3.4 item 1): the template linter is this build's proposal. §2.1 SI-01,
          §7 item 11, §9.1 and §12.8 require the identifiers on every label, wristband and print and
          golden-image tests for them, but name no linter for clinical templates (the plan's only
          template linter checks message bodies, §9.30). It adds a build-time check and replaces no
          clause; the CSO confirms or removes it [HUMAN] (docs/safety/README.md, "Tightenings").
      - id: CTRL-0001-6
        type: design
        risk_control_option: design
        covers: [c]
        description: >-
          Registration stores every name in the patient's script and in a Latin transliteration
          (proposed by the platform-i18n transliteration service and confirmed by the registrar), so
          every print can render both. A print request for a patient whose record lacks either form
          fails closed with an explicit "identity incomplete" message and raises an owned task to
          complete the registration; it never prints one script alone.
        sources: ["§2.1 SI-01", "§9.1 (identity data)", "§11.2"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-01-print-has-script-and-latin-name"
          - "UnitTest:print-fails-closed-without-transliteration"
        notes: >-
          Tightening [P] (§3.4 item 1): the registrar's confirmation of the proposed Latin form, and a
          print that fails closed with "identity incomplete" and an owned task, are this build's
          proposals. §9.1, §11.2 and §7 item 10 (the transliteration service) store the Kurdish,
          Arabic and Latin forms with transliteration variants, but say neither who confirms the
          Latin form nor what a print does when a form is missing. They add to clause c and replace
          nothing; the CSO confirms or changes them [HUMAN] (docs/safety/README.md, "Tightenings").
      - id: CTRL-0001-7
        type: design
        risk_control_option: design
        covers: [d]
        description: >-
          MRNs carry a check digit; an MRN that fails the check is rejected at entry and at scan. The
          date of birth carries a precision flag; when it is approximate, labels, banners and prints
          show the approximate-DOB flag and never present the estimate as an exact date.
        sources: ["§2.1 SI-01", "§9.1 (birth date with its precision flag)", "SAC-03"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "UnitTest:mrn-check-digit"
          - "PropertyTest:SI-01-invalid-mrn-rejected-at-entry-and-scan"
          - "AcceptanceTest:SAC-03"
      - id: CTRL-0001-8
        type: design
        risk_control_option: design
        covers: [a, d]
        description: >-
          Downtime and offline wristbands and labels (pre-allocated downtime blocks, offline print,
          the downtime printing path that works with the core down) use the same templates and the
          same two-identifier rule as the normal path.
        sources: ["§2.1 SI-01", "§13.1 EN-4", "TRU-BCP-02"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "GoldenImage:downtime-wristband-*"
          - "ScenarioSuite:downtime"
    residual_risk: {proposed: null, accepted_by: null}
    status: open
    owner: empi-squad
    cso_triage: {by: null, date: null}
    incidents: []
    releases: []

  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0002
    title: Medicine given without an active verified order, or under an override that nobody can review
    description: >-
      A dose is administered against an order that is not active and pharmacist-verified, without a
      documented override, or under an override whose reason was defaulted or that is not
      reportable, so the wrong drug, dose, route or time reaches the patient and unsafe patterns
      stay hidden.
    seeded_hazard: H2
    invariants: [SI-02]
    invariant_text: "No administration without an active verified order or a documented override. Override reasons are never defaulted, and every override is reportable"
    invariant_clauses:
      - {id: a, text: "No administration without an active verified order or a documented override."}
      - {id: b, text: "Override reasons are never defaulted,"}
      - {id: c, text: "and every override is reportable"}
    enforced_in: "MAR aggregate"
    modules: [medications, orders]
    features: [MED-MAR-01, MED-BCM-01, MED-PHV-01, CLN-ORD-02, MED-INF-01, PLT-UX-04, DX-ORD-01, CLN-QI-01, PLT-CORE-03]
    sac: [SAC-20, SAC-21, SAC-24]
    causes:
      - Administration documented against an order that is draft, on hold, discontinued, entered-in-error or not yet verified
      - A failed product or wristband scan bypassed without a recorded reason
      - A pre-selected override reason accepted without thought
      - Overrides recorded where nobody reviews them, so unsafe patterns persist
    effects: Wrong drug, dose, route or time given; unsafe override patterns go unnoticed
    initial_risk:
      severity: catastrophic
      likelihood: occasional
      level: very-high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: an unverified or discontinued
        medicine given in error can kill. Likelihood: judged before the controls below; no measured
        local rate exists yet.
    controls:
      - id: CTRL-0002-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-02 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). Its parameters are vendor-locked in
          the configuration chain: a tenant may tighten them and can never loosen them.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-02-channels-* (the same property through every channel adapter, §18.3)"
          - "PropertyTest:config-chain-vendor-lock-SI-02"
      - id: CTRL-0002-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the order and medication-administration state machines: short runs
          in the fast tier; nightly 10⁶ randomised sequences at the application-command layer plus at
          least 10⁴ through each real channel adapter, zero violations as a hard gate; the nightly
          closed-loop medication scenario suite with failures injected (wrong patient, wrong drug,
          discontinued in transit, offline administration on a stale order).
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #3", "§19.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-02-*"
          - "ScenarioSuite:closed-loop-medication"
      - id: CTRL-0002-3
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          The MAR aggregate accepts Give and StartInfusion only with the activeVerifiedOrder guard
          (the order is active and pharmacist-verified), and otherwise only through the
          GiveWithOverride path with a documented override. No other command records an
          administration. An override replaces only the failed product scan or the missing
          verification; it never waives SI-01, SI-12, SI-13 or SI-15.
        sources: ["§2.1 SI-02", "§8.4 (medication administration)", "Appendix B.3", "§9.10 acceptance 1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-02-no-administration-without-active-verified-order-or-documented-override"
          - "PropertyTest:SI-02-override-never-waives-SI-01-SI-12-SI-13-SI-15"
      - id: CTRL-0002-4
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          The override reason has no default on any channel: the design-system control starts empty,
          the API has no default value, and the domain rejects an override whose reason was not
          chosen by the user (predicate overrideReasonEntered).
        sources: ["§2.1 SI-02", "§6.5 (defaults never select)", "§14.3 tier B", "SAC-21"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-02-override-reason-never-defaulted"
          - "E2E:override-reason-has-no-default (en, ckb, ar)"
          - "AcceptanceTest:SAC-21"
      - id: CTRL-0002-5
        type: design
        risk_control_option: protective
        covers: [c]
        description: >-
          Every override (failed-scan override, emergency or first-dose administration before
          verification) emits a journaled MedicationAdministrationOverridden event and is reportable:
          scan-failure analytics, overrides by user and unit on the safety dashboard, and the event
          feed that reports it. Every override of a failed scan is a reportable event.
        sources: ["§2.1 SI-02", "§9.7 (scan, don't type)", "§9.29 (safety dashboard)", "SAC-21"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-02-every-override-reportable"
          - "IntegrationTest:safety-dashboard-overrides-by-user-and-unit"
          - "AcceptanceTest:SAC-21"
      - id: CTRL-0002-6
        type: design
        risk_control_option: protective
        covers: [a]
        description: >-
          No first dose without pharmacist verification except on the defined emergency override list
          (governed content [HUMAN]); a dose given before verification creates a pharmacist review
          task due within 4 hours; an alarm fires when the verification queue is unstaffed for more
          than 30 minutes.
        sources: ["§8.4 (order: pharmacist verifies)", "§10.3 A.4", "SAC-24"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:SAC-24"
          - "ScenarioSuite:closed-loop-medication"
      - id: CTRL-0002-7
        type: process
        risk_control_option: information
        covers: [a, c]
        description: >-
          BCMA compliance is measured: patient and medication scan rates per unit and per user on
          compliance dashboards, with BCMA live site-wide and scans at or above 95% per unit as the
          R2b criterion.
        sources: ["§9.10 (BCMA compliance dashboards)", "SAC-20"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:SAC-20"
          - "IntegrationTest:bcma-compliance-by-unit-and-user"
    residual_risk: {proposed: null, accepted_by: null}
    status: open
    owner: medications-squad
    cso_triage: {by: null, date: null}
    incidents: []
    releases: []

  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0003
    title: Work falls between owners and is never done, so an order, result, message, letter or referral is lost
    description: >-
      An order never reaches a terminal state, or a task, result, message, letter or referral has no
      owner or SLA, or loses its owner without an alarm, or a message across the seam to a hospital
      still on paper or legacy systems is not tracked, so care is delayed or never happens.
    seeded_hazard: H5
    invariants: [SI-03]
    invariant_text: "Every order reaches a terminal state. Every task, result, message, letter and referral has an owner and an SLA. Unowned work raises `TaskOrphaned` within 5 minutes. Seam messages to a hospital still on paper or legacy systems are owned tasks"
    invariant_clauses:
      - {id: a, text: "Every order reaches a terminal state."}
      - {id: b, text: "Every task, result, message, letter and referral has an owner and an SLA."}
      - {id: c, text: "Unowned work raises `TaskOrphaned` within 5 minutes."}
      - {id: d, text: "Seam messages to a hospital still on paper or legacy systems are owned tasks"}
    enforced_in: "Task engine"
    modules: [platform-tasks, orders, results, scheduling, hub]
    features: [PLT-CORE-07, PLT-CORE-03, CLN-ORD-02, DX-ORD-01, CLN-RES-01, ACC-SCH-02, INT-ENG-01, INT-SEAM-01, CLN-DOC-03, DFD-MSG-01, PLT-OPS-05]
    sac: [SAC-19, SAC-30]
    causes:
      - An order state with no path to a terminal state, or an order left open with no timer
      - Work created without an owner or SLA, or an owner deactivated, a pool emptied or a queue unwatched
      - An undeliverable message or a dead-letter item that nobody owns
      - A referral, result or medication list sent to a hospital on paper or legacy systems with no record of receipt
    effects: Delayed or missed diagnosis, treatment or follow-up
    initial_risk:
      severity: major
      likelihood: probable
      level: very-high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: a lost referral, result or order
        can cause permanent harm through delayed care. Likelihood: judged before the controls below;
        work crossing the seam to a hospital on paper is easily lost (§9.2 seam KPIs). No measured
        local rate exists yet.
    controls:
      - id: CTRL-0003-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-03 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). Its parameters, including the
          5-minute orphan alarm, are vendor-locked in the configuration chain: a tenant may tighten
          them and can never loosen them.
        sources: ["§2.1 (preamble)", "§2.2 rules 6 and 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-03-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-03 (an orphan alarm later than 5 minutes is refused)"
      - id: CTRL-0003-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
