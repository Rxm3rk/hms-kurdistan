          - "PropertyTest:config-chain-vendor-lock-SI-21"
      - id: CTRL-0021-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on access decisions for every label and purpose through every channel
          adapter (short runs in the fast tier; nightly 10⁶ sequences plus at least 10⁴ per real
          channel adapter, zero violations) and a nightly sensitivity-label scenario suite (proposed;
          §18.5 names none for SI-21).
        sources: ["§2.1 (preamble)", "§18.3"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-21-*"
          - "ScenarioSuite:sensitivity-labels (proposed)"
      - id: CTRL-0021-3
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          One policy enforcement point in the Trust Plane SDK evaluates sensitivity labels and
          purpose-of-use for every access on every channel: UI, API, print, exports, interfaces
          (including FHIR meta.security and HL7 v2), AI grounding and analytics; no repository access
          bypasses the SDK.
        sources: ["§2.1 SI-21", "§5.2 (dependency rules)", "§13.1 AZ-1, AZ-3", "ADR-013", "§6.8 item 4"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
