  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0006
    title: Signed clinical documentation is altered, lost or silently deleted, so care and the legal record rest on wrong information
    description: >-
      A signed note is changed in place, an amendment overwrites the original, an addendum is merged
      into the signed text, a note is deleted instead of marked entered-in-error, or the signed
      rendering cannot be proven unchanged.
    seeded_hazard: H6
    invariants: [SI-06]
    invariant_text: "Signed notes are immutable. Amendments are versions, addenda are links, entered-in-error replaces delete, and the signed rendering is hashed"
    invariant_clauses:
      - {id: a, text: "Signed notes are immutable."}
      - {id: b, text: "Amendments are versions,"}
      - {id: c, text: "addenda are links,"}
      - {id: d, text: "entered-in-error replaces delete,"}
      - {id: e, text: "and the signed rendering is hashed"}
    enforced_in: "Clinical journal"
    modules: [record, platform-journal, platform-docs]
    features: [PLT-CORE-01, CLN-DOC-01, CLN-DOC-04, INT-DOC-01, PLT-CORE-03]
    sac: [SAC-45]
    causes:
      - An update path to a signed note through any channel or a database script
      - An amendment that overwrites rather than versions
      - An addendum written into the signed text
      - A delete instead of entered-in-error
      - A signed rendering regenerated differently from what was signed
    effects: Clinicians act on altered information; the legal record cannot be trusted
    initial_risk:
      severity: major
      likelihood: occasional
      level: high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: decisions taken on altered or
        missing documentation can cause permanent harm, and the medico-legal record is lost.
        Likelihood: judged before the controls below; no measured local rate exists yet.
    controls:
      - id: CTRL-0006-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-06 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). It is vendor-locked in the
          configuration chain: a tenant may tighten it and can never loosen it.
        sources: ["§2.1 (preamble)", "§2.2 rules 2 and 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-06-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-06"
      - id: CTRL-0006-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the clinical-note lifecycle (short runs in the fast tier; nightly
          10⁶ sequences plus at least 10⁴ per real channel adapter, zero violations) and a nightly
          record-immutability scenario suite (proposed; §18.5 names no suite for SI-06).
        sources: ["§2.1 (preamble)", "§8.4 (clinical note)", "§18.1", "§18.3"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-06-*"
          - "ScenarioSuite:record-immutability (proposed)"
      - id: CTRL-0006-3
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          No command on any channel changes a signed note. Clinical facts are immutable and
          bitemporal; database permissions and a schema linter forbid UPDATE and DELETE on fact
          tables.
        sources: ["§2.1 SI-06", "§2.2 rule 2", "§6.4", "§6.8 item 2", "§9.4 acceptance", "SAC-45"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-06-signed-note-immutable-on-every-channel"
          - "StaticAnalysis:no-update-or-delete-on-fact-tables"
          - "AcceptanceTest:SAC-45"
      - id: CTRL-0006-4
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          An amendment is a new version with reason, author and time, linked to the version it
          supersedes; the original stays viewable.
        sources: ["§2.1 SI-06", "§13.4 (amendments)", "SAC-45"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-06-amendment-is-a-new-version"
      - id: CTRL-0006-5
        type: design
        risk_control_option: design
        covers: [c]
        description: >-
          An addendum is a separate note linked to the signed note, never text written into it;
          patient-requested amendments become an addendum with a flag and a statement of
          disagreement.
        sources: ["§2.1 SI-06", "§8.4 (clinical note)", "§13.4 (amendments)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-06-addendum-is-a-link"
      - id: CTRL-0006-6
        type: design
        risk_control_option: design
        covers: [d]
        description: >-
          No delete exists on any channel: retraction is entered-in-error with a reason, and the
          original stays in the record. Wrong-patient documentation is moved under a controlled,
          audited workflow that sends corrected messages downstream. Records are never auto-deleted;
          destruction needs a schedule, an approval and a legal-hold check.
        sources: ["§2.1 SI-06", "§2.3 (never auto-delete)", "§13.4 (amendments, retention)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-06-entered-in-error-replaces-delete"
          - "IntegrationTest:wrong-patient-documentation-move-is-audited"
      - id: CTRL-0006-7
        type: design
        risk_control_option: protective
        covers: [e]
        description: >-
          At signing the rendered document is hashed and the hash is stored with the signature; any
          later rendering of the signed version is checked against the hash.
        sources: ["§2.1 SI-06", "§8.4 (clinical note: final, rendering hashed)", "SAC-45"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "UnitTest:signed-rendering-hash"
          - "IntegrationTest:signed-rendering-hash-verified-on-re-render"
    residual_risk: {proposed: null, accepted_by: null}
    status: open
    owner: record-squad
    cso_triage: {by: null, date: null}
    incidents: []
    releases: []

  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0007
    title: Unreviewed AI output enters the record, an order, a result or a patient message and is acted on
    description: >-
      AI-generated content is treated as final without a human signature, or an AI component signs
      an order, files a result or messages a patient, so an AI error reaches care unchecked.
    seeded_hazard: H10
    invariants: [SI-07]
    invariant_text: "AI output stays `draft-ai` until a human signs it. AI never signs orders, files results or messages patients (applies from P2)"
    invariant_clauses:
      - {id: a, text: "AI output stays `draft-ai` until a human signs it."}
      - {id: b, text: "AI never signs orders,"}
      - {id: c, text: "files results"}
      - {id: d, text: "or messages patients"}
      - {id: e, text: "(applies from P2)"}
    enforced_in: "AI control plane"
    modules: [ai-gateway, orders, results, front-door, record]
    features: [AI-GW-01, AI-GOV-01, AI-DCS-01, AI-SUM-01, AI-PAT-01, AI-INB-01, AI-AMB-01, AI-NUR-01]
    sac: [SAC-17]
    causes:
      - An AI draft saved or shown as a final document without a human signature
      - An AI agent holding a credential or tool scope that can sign orders, file results or send patient messages
      - AI-generated patient text sent instead of an approved template
    effects: An AI error is acted on as if a clinician had checked it
    initial_risk:
      severity: catastrophic
      likelihood: occasional
      level: very-high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: an unreviewed AI-drafted order or
        result can kill. Likelihood: judged before the controls below for the P2 AI features; no AI
        runs in the MVP.
    controls:
      - id: CTRL-0007-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-07 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). It is vendor-locked in the
          configuration chain: a tenant may tighten it and can never loosen it.
        sources: ["§2.1 (preamble)", "§2.2 rules 7 and 10", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-07-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-07"
      - id: CTRL-0007-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the clinical-note, order and result state machines with an AI actor
          (short runs in the fast tier; nightly 10⁶ sequences plus at least 10⁴ per real channel
          adapter, zero violations) and a nightly AI-draft scenario suite from P2 (proposed; §18.5
          names no suite for SI-07).
        sources: ["§2.1 (preamble)", "§18.1", "§18.3"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-07-*"
          - "ScenarioSuite:ai-draft (proposed, P2)"
      - id: CTRL-0007-3
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          Every AI-produced artefact carries source ai-draft and the state draft-ai; it becomes final
          only through a signature by an authenticated human, and provenance records model, prompt
          template version, sources, raw output, human edits, signer and time.
        sources: ["§2.1 SI-07", "§2.2 rule 10", "§5.3 B (source ai-draft)", "§8.4 (clinical note)", "§17.3 G3, G4"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-07-draft-ai-until-a-human-signs"
          - "ArchTest:draft-ai-state-tests"
      - id: CTRL-0007-4
        type: design
        risk_control_option: design
        covers: [b, c, d]
        description: >-
          AI identities (the AI gateway's agents and service identities) are denied the sign-order,
          file-result and send-patient-message commands by the policy decision point in the domain;
          agents use public APIs with least-privilege tool scopes and approval for writes, never the
          database.
        sources: ["§2.1 SI-07", "§2.2 rule 10", "§17.3 G4, G13", "ADR-018"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-07-ai-never-signs-orders"
          - "PropertyTest:SI-07-ai-never-files-results"
          - "PropertyTest:SI-07-ai-never-messages-patients"
          - "StaticAnalysis:database-credential-scanner"
      - id: CTRL-0007-5
        type: design
        risk_control_option: design
        covers: [d]
        description: >-
          Patient-facing text comes only from approved templates: AI may suggest a template and never
          writes patient text; patient-facing AI identifies itself; labelled results and pregnancy
          tests are never used.
        sources: ["§2.1 SI-07", "§17.3 G10", "AI-PAT-01", "A.20 (AI-PAT-01)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:ai-pat-01-template-only-patient-text"
      - id: CTRL-0007-6
        type: design
        risk_control_option: design
        covers: [e]
        description: >-
          No AI runs in the MVP. The draft-ai state and the denial policies are built into the domain
          before any AI feature, and no AI feature can be activated for a site until the SI-07
          controls are verified and its classification record is in the Boundary Register; until
          then every AI surface fails closed to "unavailable" with the manual path intact.
        sources: ["§2.1 SI-07", "§17.2", "§17.3 G14", "§21 Phase 5"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PromotionGate:ai-feature-needs-verified-SI-07-controls"
          - "UnitTest:ai-surface-fails-closed-when-unavailable"
      - id: CTRL-0007-7
        type: process
        risk_control_option: information
        covers: [a]
        description: >-
          At AI GA the control-plane requirements G1 to G16 apply: registry, model cards and source
          attributes in the workflow, accept/edit/reject reasons, monitoring of drift and overrides,
          AI safety events into the incident pipeline, per-feature per-site kill switch, regression
          evaluation in English, Arabic and Sorani before any model or prompt update.
        sources: ["§17.3 G1 to G16", "SAC-17"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:SAC-17"
    residual_risk: {proposed: null, accepted_by: null}
    status: open
    owner: ai-gateway-squad
    cso_triage: {by: null, date: null}
    incidents: []
    releases: []

  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0008
    title: Two patients' records are combined or wrongly merged, so care is based on another person's data
    description: >-
      A merge cannot be undone or does not reach downstream systems, an overlay is not handled as a
      safety incident, or automatic matching merges different people, which is likely with
      four-part names written in Kurdish, Arabic and Latin scripts.
    seeded_hazard: H12
    invariants: [SI-08]
    invariant_text: "Merges are reversible links propagated downstream (HL7 A40 / FHIR `Patient.link`). Overlays are safety incidents. Auto-merge precision ≥99.9%, measured on a cross-script Kurdish/Arabic/Latin gold set"
    invariant_clauses:
      - {id: a, text: "Merges are reversible links"}
      - {id: b, text: "propagated downstream (HL7 A40 / FHIR `Patient.link`)."}
      - {id: c, text: "Overlays are safety incidents."}
      - {id: d, text: "Auto-merge precision ≥99.9%, measured on a cross-script Kurdish/Arabic/Latin gold set"}
    enforced_in: "EMPI"
    modules: [empi, hub, quality]
    features: [ACC-ID-01, KRI-ID-01, ACC-ID-03, INT-ENG-01, INT-FHIR-01, INT-SEAM-01, CLN-INC-01]
    sac: [SAC-08]
    causes:
      - A merge implemented as a destructive copy that cannot be reversed
      - Downstream systems not told about a merge or unmerge
      - An overlay corrected quietly instead of investigated
      - Transliteration variants and four-part names matched wrongly by the algorithm
    effects: Treatment decided on another person's allergies, results or medicines; data lost on unmerge
    initial_risk:
      severity: catastrophic
      likelihood: occasional
      level: very-high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: decisions on an overlaid record
        (allergies, blood group, medicines) can kill. Likelihood: judged before the controls below;
        cross-script names make matching hard (K §8); no measured local rate exists yet.
    controls:
      - id: CTRL-0008-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-08 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). Its parameters, including the
          auto-merge precision floor, are vendor-locked in the configuration chain: a tenant may
          tighten them and can never loosen them.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-08-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-08"
      - id: CTRL-0008-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the identity lifecycle (short runs in the fast tier; nightly 10⁶
          sequences plus at least 10⁴ per real channel adapter, zero violations); the nightly
          identity and seam scenario suites (merge and unmerge with downstream notification,
          cross-script duplicates, no overlays).
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #6, #10", "§19.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-08-*"
          - "ScenarioSuite:identity"
          - "ScenarioSuite:seam"
      - id: CTRL-0008-3
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          A merge is a link that re-points clinical data, orders, results and accounts and records the
          algorithm version; unmerge restores every re-pointed record; results are never silently
          re-attached.
        sources: ["§2.1 SI-08", "§8.4 (identity)", "§9.1 (duplicates and merges)", "§9.1 acceptance", "SAC-08"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-08-unmerge-restores-every-re-pointed-record"
          - "AcceptanceTest:SAC-08"
      - id: CTRL-0008-4
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          Merge and unmerge propagate downstream through the Hub as HL7 v2 ADT A40 and FHIR
          Patient.link, with acknowledgement state per message and owned queues for anything
          undelivered.
        sources: ["§2.1 SI-08", "§5.3 (integration messages)", "§12.1", "SAC-08"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "ContractTest:hl7-adt-a40-merge-and-unmerge"
          - "ContractTest:fhir-patient-link"
          - "ScenarioSuite:identity"
      - id: CTRL-0008-5
        type: design
        risk_control_option: protective
        covers: [c]
        description: >-
          A suspected or confirmed overlay opens a safety incident automatically: the records are
          frozen, split by provenance and the people affected are notified; RCA follows in the
          quality module and the Safety Event pipeline.
        sources: ["§2.1 SI-08", "§9.1 (an overlay is a safety incident)", "§9.29", "§10.1 (Safety Event pipeline)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "IntegrationTest:overlay-opens-safety-incident-and-freezes-records"
          - "ScenarioSuite:identity"
      - id: CTRL-0008-6
        type: test
        risk_control_option: protective
        covers: [d]
        description: >-
          A gold-set evaluation tool measures auto-merge precision and recall on the cross-script
          Kurdish, Arabic and Latin gold set (synthetic in development; the S14-K 2,000-pair set when
          available). Auto-merge is enabled only while measured precision is at least 99.9%; below
          that, candidate matches go to the HIM steward queue.
        sources: ["§2.1 SI-08", "§9.1 (gold-set evaluation tool, acceptance)", "K S14-K"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "GoldSetEvaluation:empi-cross-script-auto-merge-precision"
          - "PropertyTest:SI-08-auto-merge-disabled-below-precision-floor"
      - id: CTRL-0008-7
        type: process
        risk_control_option: information
        covers: [c, d]
        description: >-
          The HIM steward queue reviews candidate matches; a duplicate-rate dashboard and the overlay
          count (target 0) are reported.
        sources: ["§9.1", "§9.29 (EMPI duplicates and overlays)", "SAC-08"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "IntegrationTest:duplicate-rate-and-overlay-dashboard"
    residual_risk: {proposed: null, accepted_by: null}
    status: open
    owner: empi-squad
    cso_triage: {by: null, date: null}
    incidents: []
    releases: []

  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0009
    title: A medicine is wrongly continued, omitted or duplicated at a transition because reconciliation closed with items undecided
    description: >-
      Medication reconciliation at admission, transfer or discharge is completed while some items
      have no decision, so an intended change is lost or an unintended medicine continues.
    seeded_hazard: H2
    invariants: [SI-09]
    invariant_text: "Medication reconciliation cannot complete while any item is undecided"
    invariant_clauses:
      - {id: a, text: "Medication reconciliation cannot complete while any item is undecided"}
    enforced_in: "Med-rec aggregate"
    modules: [medications]
    features: [CLN-MRC-01, CLN-DOC-03, ACC-ADT-01, INT-SEAM-01, MED-DSP-01]
    sac: [SAC-26]
    causes:
      - A completion command accepted with undecided items on some channel
      - Items arriving after the decisions were made (a seam medication list, transcribed orders at an upgrade) not added as undecided items
    effects: Omitted, duplicated or wrongly continued medicines after a transition of care
    initial_risk:
      severity: major
      likelihood: probable
      level: very-high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: an omitted or duplicated medicine
        can cause permanent harm. Likelihood: judged before the controls below; transitions happen
