        sources: ["§2.1 SI-21", "§9.8 (patient release)", "§9.30 (report-release rule, acceptance)", "SAC-31"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-21-labelled-results-and-pregnancy-tests-never-released-by-message"
          - "AcceptanceTest:SAC-31"
      - id: CTRL-0021-8
        type: design
        risk_control_option: protective
