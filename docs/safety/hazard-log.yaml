          - "ArchTest:no-repository-access-without-trust-sdk"
      - id: CTRL-0021-4
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          Purpose of use is required on every access and disclosure; access outside a care
          relationship needs a reason or break-the-glass (reason code and text, time-boxed,
          scope-limited, privacy-office notice, review within one working day).
        sources: ["§2.1 SI-21", "§13.1 AZ-2, AZ-4, AZ-7", "TRU-IAM-03"]
