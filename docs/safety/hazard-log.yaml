  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0010
    title: The record shows a false time or order of care, or back-dating nobody can trace, leading to wrong clinical decisions
    description: >-
      Clinical time is confused with system time, entries are back-dated without privilege or audit,
      or back-entered events after an outage lose their original clinical times or their label, so
      clinicians misread what happened and when.
    seeded_hazard: H6
    invariants: [SI-10]
    invariant_text: "Clinical time is distinct from system time. Back-dating is privileged and audited. Back-entry keeps the original clinical times and is labelled. Back-entry after outages will be frequent, so tooling and audit are sized for it"
    invariant_clauses:
      - {id: a, text: "Clinical time is distinct from system time."}
      - {id: b, text: "Back-dating is privileged and audited."}
      - {id: c, text: "Back-entry keeps the original clinical times and is labelled."}
      - {id: d, text: "Back-entry after outages will be frequent, so tooling and audit are sized for it"}
    enforced_in: "Bitemporal journal"
    modules: [platform-journal, record, adt, trust-audit]
    features: [PLT-CORE-01, TRU-BCP-03, TRU-BCP-01, TRU-BCP-05, TRU-AUD-01, TRU-IAM-02, ACC-ADT-01, CLN-DOC-01, PLT-CORE-03]
    sac: [SAC-47]
    causes:
      - One timestamp used for both when it happened and when it was recorded
      - Back-dating available to any user, or not audited
      - Back-entry tooling stamping entries with the entry time, or not labelling them
      - Back-entry volumes after outages overwhelming tooling or audit
    effects: A dose repeated or omitted, or a deterioration missed, because the timeline is wrong
    initial_risk:
      severity: major
      likelihood: occasional
      level: high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: a misread timeline can lead to a
        repeated or omitted dose. Likelihood: SI-10 itself says back-entry after outages will be
        frequent; harmful misreading is judged less frequent; judged before the controls below.
    controls:
      - id: CTRL-0010-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-10 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). It is vendor-locked in the
          configuration chain: a tenant may tighten it and can never loosen it.
        sources: ["§2.1 (preamble)", "§2.2 rules 2 and 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-10-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-10"
      - id: CTRL-0010-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests with clock skew, out-of-order events and back-entry (short runs in the
          fast tier; nightly 10⁶ sequences plus at least 10⁴ per real channel adapter, zero
          violations); the nightly downtime scenario suite (back-entry with original times).
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #7", "§19.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-10-*"
          - "ScenarioSuite:downtime"
      - id: CTRL-0010-3
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          Every fact and journal row carries clinical (valid) time and recorded (system) time as
          separate fields; time comes from an injected Clock and the domain never calls now().
        sources: ["§2.1 SI-10", "§5.3 C", "§6.2 (time)", "§6.4"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-10-clinical-time-distinct-from-system-time"
          - "ArchTest:no-now-in-domain"
      - id: CTRL-0010-4
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          Back-dating needs a privilege and emits an audit event with reason, actor and both times
          (predicate privilegedAndAudited); ADT events are back-dated only with supervisor rights.
        sources: ["§2.1 SI-10", "§9.12 (back-dated events)", "§13.1 AU-1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-10-back-dating-is-privileged-and-audited"
      - id: CTRL-0010-5
        type: design
        risk_control_option: design
        covers: [c]
        description: >-
          Back-entry keeps the paper's clinical time as the valid time and labels the entry as late or
          downtime entry on screen, in print and in exports.
        sources: ["§2.1 SI-10", "§9.4 (back-entry)", "§13.4 (entry metadata)", "§16.3 L4", "SAC-47"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-10-back-entry-keeps-clinical-time-and-label"
          - "AcceptanceTest:SAC-47"
      - id: CTRL-0010-6
        type: design
        risk_control_option: design
        covers: [d]
        description: >-
          Back-entry tooling (TRU-BCP-03) supports bulk entry from downtime forms with a
          reconciliation queue, and the audit store is sized for post-outage volumes; a performance
          test back-enters a simulated long outage.
        sources: ["§2.1 SI-10", "TRU-BCP-03", "§16.3"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PerformanceTest:back-entry-after-simulated-long-outage"
          - "ScenarioSuite:downtime"
      - id: CTRL-0010-7
        type: training
        risk_control_option: information
        covers: [c, d]
        description: >-
          Code-Dark drills twice a year per unit exercise back-entry; drill tooling (TRU-BCP-05)
          produces evidence with measured times.
        sources: ["§16.5", "TRU-BCP-05", "SAC-47"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "DrillReport:code-dark-back-entry [HUMAN run]"
