  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0020
    title: Patient health information leaves its residency boundary or is exposed in plaintext off site
    description: >-
      Usable PHI leaves the hospital's on-site cell and the Kurdistan DR site, an off-site copy is
      readable without hospital-held keys, a processor receives PHI without an approved entry, or
      PHI appears in message bodies, telemetry, logs, prompts or support sessions that leave the
      cell.
    seeded_hazard: H13
    invariants: [SI-20]
    invariant_text: "Usable PHI stays in the hospital's on-site cell and the Kurdistan DR site; anything off-site is ciphertext under hospital-held keys. The only exception is a per-tenant processor entry approved by the Safety Board (data processing agreement, zero retention, region pinning, minimisation, payload audit). Message bodies carry no clinical content. No PHI or PHI-derived data in telemetry, logs, prompts or support sessions that leave the cell"
    invariant_clauses:
      - {id: a, text: "Usable PHI stays in the hospital's on-site cell and the Kurdistan DR site;"}
      - {id: b, text: "anything off-site is ciphertext under hospital-held keys."}
      - {id: c, text: "The only exception is a per-tenant processor entry approved by the Safety Board (data processing agreement, zero retention, region pinning, minimisation, payload audit)."}
      - {id: d, text: "Message bodies carry no clinical content."}
      - {id: e, text: "No PHI or PHI-derived data in telemetry, logs, prompts or support sessions that leave the cell"}
    enforced_in: "Trust Plane; AI gateway; egress tests"
    modules: [trust-keys, trust-policy, ai-gateway, front-door, platform-site]
    features: [TRU-KEY-01, PLT-OPS-01, PLT-OPS-04, PLT-SITE-01, TRU-BCP-04, AI-DAT-02a, AI-GW-01, PLT-OPS-05, DFD-MSG-01, KRI-MSG-01, IMP-SUP-01]
    sac: [SAC-33]
    causes:
      - A network path from the cell to an unapproved destination
      - An off-site backup or replica encrypted with keys the hospital does not hold, or not encrypted
      - PHI sent to a processor or AI model without an approved entry
      - Clinical content in a WhatsApp, Viber or SMS body or a push notification
      - Identifiers or free text in logs, traces, metrics, prompts or support sessions
    effects: Exposure of patients' health information; loss of trust and lawful basis
    initial_risk:
      severity: major
      likelihood: occasional
      level: high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: a mass exposure of health records
        harms many patients. Likelihood: judged before the controls below; no measured rate exists.
    controls:
      - id: CTRL-0020-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-20 is enforced below the API for every channel (UI, API, mobile, interfaces, migration
          loaders, plugins and AI agents) through the Trust Plane and the cell's network policy. It is
          vendor-locked in the configuration chain: a tenant may tighten it and can never loosen it.
        sources: ["§2.1 (preamble)", "§2.2 rules 7 and 9", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-20-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-20"
      - id: CTRL-0020-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on egress decisions (short runs in the fast tier; nightly 10⁶
          sequences plus at least 10⁴ sequences through each real channel adapter, zero
          violations); egress tests on every release and a nightly egress scenario suite (proposed;
          §18.5 names none for SI-20).
        sources: ["§2.1 (preamble)", "§6.8 item 11", "§18.2 (topology and egress)", "§18.3"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-20-*"
          - "EgressTest:release-*"
          - "ScenarioSuite:egress (proposed)"
      - id: CTRL-0020-3
        type: design
        risk_control_option: protective
        covers: [a]
        description: >-
          The cell's network policy allows only approved outbound destinations; the only replication
          target for the tenant's data is the Kurdistan DR site; nothing goes offshore by default until
          Q-K2 is answered.
        sources: ["§2.1 SI-20", "§2.2 rule 9", "§6.8 item 11", "§13.3 (residency)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "EgressTest:cell-allows-only-approved-destinations"
      - id: CTRL-0020-4
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          Everything that leaves the cell (DR warm standby, off-site backups, CDC bronze landing,
          removable off-site backups) is ciphertext under per-tenant envelope keys held by the hospital
          (TPM or HSM on site, escrowed at the DR site under dual control).
        sources: ["§2.1 SI-20", "ADR-008", "§5.1", "§16.2", "§17.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "IntegrationTest:off-site-copies-are-ciphertext-under-hospital-keys"
          - "KeyTest:key-rotation-and-crypto-shredding"
      - id: CTRL-0020-5
        type: design
        risk_control_option: protective
        covers: [c]
        description: >-
          Egress of PHI to a processor is blocked unless an approved per-tenant processor entry exists
          with a data processing agreement, zero retention, region pinning, minimisation and payload
          audit; Safety Board approval is recorded only from a human sign-off record [HUMAN].
        sources: ["§2.1 SI-20", "§13.3", "§13.1 AI-4", "§3.5"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-20-processor-egress-needs-approved-entry"
          - "EgressTest:processor-entry-required"
      - id: CTRL-0020-6
        type: design
        risk_control_option: protective
        covers: [d]
        description: >-
          Message templates for WhatsApp, Viber, SMS and push carry no clinical content: a template
          linter and payload tests reject clinical content, and notifications carry no PHI.
        sources: ["§2.1 SI-20", "§9.30 (report-release rule, acceptance)", "SAC-33"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "TemplateLint:no-clinical-content-in-message-bodies"
          - "ContractTest:message-payload-has-no-clinical-content"
          - "AcceptanceTest:SAC-33"
      - id: CTRL-0020-7
        type: test
        risk_control_option: protective
        covers: [e]
        description: >-
          Logging goes through a PHI-safe API with an allowlist of fields (free text and identifiers
          are never logged); scenario suites run with canary synthetic identities and CI fails if any
          canary value, or a value derived from one, appears in logs, traces or metrics; telemetry
          that leaves the cell carries no PHI or PHI-derived data by construction.
        sources: ["§2.1 SI-20", "§6.2 (PHI-safe logging)", "§6.7", "§6.8 item 5"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "CanaryScan:phi-in-logs-traces-metrics"
      - id: CTRL-0020-8
        type: design
        risk_control_option: protective
        covers: [e]
        description: >-
          Prompts leave the cell only through the AI gateway with PHI minimisation, and never carry PHI
          or PHI-derived data to an external model without a DPA, a counsel opinion and the SI-20
          processor entry (P2).
        sources: ["§2.1 SI-20", "§13.1 AI-4", "§17.3 G12", "ADR-018"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "EgressTest:ai-gateway-sends-no-phi-without-processor-entry (P2)"
      - id: CTRL-0020-9
        type: design
        risk_control_option: design
        covers: [e]
        description: >-
          Support reaches data only inside the cell: vendor access is just-in-time with customer
          lockbox approval and session recording, and no support session carries PHI or PHI-derived
          data out of the cell.
        sources: ["§2.1 SI-20", "§13.1 IA-6, PL-3", "§13.2 (vendor access)", "ADR-027"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "IntegrationTest:support-session-stays-inside-the-cell"
    residual_risk: {proposed: null, accepted_by: null}
    status: open
    owner: trust-keys-squad
    cso_triage: {by: null, date: null}
    incidents: []
