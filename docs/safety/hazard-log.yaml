  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0004
    title: A critical result does not reach a responsible clinician in time, so treatment is delayed
    description: >-
      A critical result goes to an untraceable recipient, is phoned without read-back, is not
      escalated when unacknowledged, or never reaches an external referring doctor of an
      outpatient-tier patient, so urgent treatment is delayed or missed.
    seeded_hazard: H3
    invariants: [SI-04]
    invariant_text: "Critical results go to a **named** recipient (chosen from a picker, never free text), with read-back and a timed escalation chain. This includes **external referring doctors** for outpatient-tier results"
    invariant_clauses:
      - {id: a, text: "Critical results go to a **named** recipient (chosen from a picker, never free text),"}
      - {id: b, text: "with read-back"}
      - {id: c, text: "and a timed escalation chain."}
      - {id: d, text: "This includes **external referring doctors** for outpatient-tier results"}
    enforced_in: "Critical-result service"
    modules: [results, platform-tasks, workforce, lis, ris]
    features: [DX-CRT-01, DX-ORD-01, CLN-RES-01, PLT-CORE-07, ERP-HR-01, PLT-UX-04, DX-LAB-03, DX-RIS-02]
    sac: [SAC-29]
    causes:
      - Recipient recorded as free text ("RN notified") that nobody can trace
      - A phoned result misheard and not read back
      - No escalation when the recipient does not acknowledge, including at weekends and holidays
      - External referring doctors of outpatient-tier patients not treated as recipients
    effects: Urgent treatment delayed or missed after a critical result
    initial_risk:
      severity: catastrophic
      likelihood: occasional
      level: very-high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: a critical result not acted on in
        time can lead to death. Likelihood: judged before the controls below; outpatient-tier results
        to external referrers are a known gap (K SI-04). No measured local rate exists yet.
    controls:
      - id: CTRL-0004-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-04 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). Its parameters are vendor-locked in
          the configuration chain: a tenant may tighten them and can never loosen them.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-04-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-04"
      - id: CTRL-0004-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the result and critical-result state machines (short runs in the
          fast tier; nightly 10⁶ sequences plus at least 10⁴ per real channel adapter, zero
          violations); the nightly results-closure scenario suite (critical value, named recipient,
          escalation, external referrers).
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #5", "§19.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-04-*"
          - "ScenarioSuite:results-closure"
      - id: CTRL-0004-3
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          The recipient of a critical result is picked from the directory (staff master and
          registered external referrers), never typed; a free-text recipient is rejected. The record
          holds date, time, the responsible laboratory person, the traceable recipient, the result
          and the read-back.
        sources: ["§2.1 SI-04", "§9.7 (critical-result service)", "§9.7 acceptance 2", "SAC-29"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-04-recipient-always-picked-from-directory"
          - "AcceptanceTest:critical-result-cannot-close-without-directory-recipient"
          - "AcceptanceTest:SAC-29"
      - id: CTRL-0004-4
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          A phoned critical result cannot be closed without recorded read-back; electronic delivery
          counts only with confirmed receipt.
        sources: ["§2.1 SI-04", "§9.7 (critical-result service)", "§9.7 acceptance 2", "SAC-29"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-04-phoned-result-needs-read-back"
          - "AcceptanceTest:critical-result-phoned-cannot-close-without-read-back"
      - id: CTRL-0004-5
        type: design
        risk_control_option: protective
        covers: [c]
        description: >-
          Unacknowledged critical results escalate automatically along the configured chain on
          calendar-aware timers (CriticalResultEscalated); a dashboard shows performance against
          policy. Thresholds, target times and chains are governed content approved by the
          laboratory director and the CSO [HUMAN]; until then only synthetic policy content marked
          NOT FOR CLINICAL USE exists.
        sources: ["§2.1 SI-04", "§9.7 (policy tables, escalation)", "§9.7 acceptance 3", "§3.4 item 3", "SAC-29"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "ScenarioTest:critical-result-escalation-simulated-clock-weekends-and-holidays"
          - "ScenarioSuite:results-closure"
      - id: CTRL-0004-6
        type: design
        risk_control_option: design
        covers: [d]
        description: >-
          External referring doctors of outpatient-tier patients are first-class recipients with the
          same record and read-back logger, including during the outpatient laboratory downtime
          protocol (phone with read-back logged on the edge agent, back-entry within 4 hours).
        sources: ["§2.1 SI-04", "§9.7 (external referring doctors)", "§9.7 acceptance 5", "§16.3 L1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:external-referrer-notification-end-to-end"
          - "ScenarioSuite:results-closure"
      - id: CTRL-0004-7
        type: process
        risk_control_option: information
        covers: [c]
        description: >-
          The critical-result escalation chain is a Boundary Register sweep candidate; its Register
          entry records its classification, and until that triage is written it runs with
          clinician-chosen actions as the §10.3 sweep-candidate fallback says (see HAZ-0018).
        sources: ["§10.2 (sweep candidates)", "§10.3 D"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "RegisterTest:sweep-candidate-critical-result-escalation-chain-seeded"
