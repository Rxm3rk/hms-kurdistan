  - id: HAZ-0017
    title: A result that arrives around or after discharge is never seen or acted on
    description: >-
      Results still pending when a patient leaves, or results arriving for a discharged patient, land
      in no owned queue, so nobody acts on them.
    seeded_hazard: H3
    invariants: [SI-17]
    invariant_text: "Results pending at discharge, and results for discharged patients, go to owned queues"
    invariant_clauses:
      - {id: a, text: "Results pending at discharge,"}
      - {id: b, text: "and results for discharged patients, go to owned queues"}
    enforced_in: "Results routing"
    modules: [results, adt, platform-tasks, record]
    features: [CLN-RES-01, DX-ORD-01, CLN-DOC-03, ACC-ADT-01, PLT-CORE-07]
    sac: [SAC-30, SAC-31]
    causes:
      - Results routed to the inpatient team's inbox after the encounter closes
      - Pending results not listed with an owner at discharge
      - The responsible clinician absent with no surrogate
    effects: A significant result for a discharged patient is never acted on
    initial_risk:
      severity: major
      likelihood: occasional
      level: high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: an unacted result after discharge
        can cause permanent harm. Likelihood: judged before the controls below.
    controls:
      - id: CTRL-0017-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-17 is enforced in the domain layer, below the API, for every channel (UI, API, mobile,
          interfaces, migration loaders, plugins and AI agents). It is vendor-locked in the
          configuration chain: a tenant may tighten it and can never loosen it.
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-17-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-17"
      - id: CTRL-0017-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the encounter and result state machines across discharge (short
          runs in the fast tier; nightly 10⁶ sequences plus at least 10⁴ per real channel adapter,
          zero violations); the nightly results-closure suite (a discharged patient's result).
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #5", "§19.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-17-*"
          - "ScenarioSuite:results-closure"
      - id: CTRL-0017-3
        type: design
        risk_control_option: design
        covers: [a]
        description: >-
          At discharge every pending result is routed to an explicit owned queue with a responsible
          clinician and an SLA, and the discharge summary lists every pending result with its owner.
        sources: ["§2.1 SI-17", "§8.4 (encounter: discharge)", "§9.18 (results inbox, acceptance)", "SAC-30"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-17-pending-results-at-discharge-go-to-owned-queue"
          - "AcceptanceTest:discharge-summary-lists-every-pending-result-with-owner"
          - "AcceptanceTest:SAC-30"
      - id: CTRL-0017-4
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          A result arriving for a discharged patient always lands in an owned queue and raises a task,
          never only in the inbox of a closed encounter.
        sources: ["§2.1 SI-17", "§9.18 acceptance"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-17-result-for-discharged-patient-goes-to-owned-queue"
      - id: CTRL-0017-5
        type: design
        risk_control_option: protective
        covers: [a, b]
        description: >-
          These queues have surrogate coverage for absence, are orphan-alarmed like every task (SI-03),
          report unacknowledged abnormal results older than 7 days, and amended results notify and are
          flagged.
        sources: ["§9.18 (results inbox)", "SAC-30", "SAC-31"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:SAC-31"
          - "IntegrationTest:unacknowledged-abnormal-results-over-7-days-report"
