# HMS Kurdistan hazard log (BUILD-PROMPT.md §3.1, §10.1; entry template Appendix B.2).
#
# This file is data. CI reads it with `sh tools/hms safety check [--json]` against
# docs/safety/hazard-log.schema.json. Read docs/safety/README.md first.
#
# Seeded in WP-0.1:
# - seeded_hazards: H1 to H15 as written in BUILD-PROMPT.md §2.4 (BP §5.1);
# - hazards: one entry per safety invariant, SI-01 to SI-21 (HAZ-0001 to HAZ-0021, in SI order),
#   each quoting its invariant verbatim (invariant_text) and split into clauses (invariant_clauses)
#   so that the check can prove every clause is covered by at least one control;
# - HAZ-0022 to HAZ-0027: one entry per SI-21 sensitivity label, because SI-21 says
#   "Each label has its own hazard entry and property tests".
#
# Rules that hold for every entry until a human says otherwise:
# - every control is `planned`, with empty implemented_in and verified_by;
# - initial_risk is an agent proposal for CSO triage [HUMAN], never an acceptance;
# - residual_risk.accepted_by, cso_triage.by, cso_triage.date and every approval field stay null
#   until a human adds a sign-off record under docs/safety/signoffs/ (BUILD-PROMPT §3.5).
#   The agent never fills them.
#
# References: "§n" is BUILD-PROMPT.md; "K §n" is BLUEPRINT-KURDISTAN.md; "BP §n" is BLUEPRINT.md;
# "SAC-nn" is a patient-safety acceptance criterion in BUILD-PROMPT §18.4.
# Test names in planned_verification and verified_by use the form <Kind>:<name> (README, "Test names").

schema_version: 1

document:
  title: HMS Kurdistan hazard log
  seeded_in: WP-0.1
  sources:
    - "BUILD-PROMPT.md §2.1 (SI-01 to SI-21), §2.4 (H1 to H15)"
    - "BUILD-PROMPT.md §10.1 (hazard log service), §10.3 (fallback control sets)"
    - "BUILD-PROMPT.md §18.4 (SAC-01 to SAC-53), §18.5 (scenario suites)"
    - "BUILD-PROMPT.md Appendix A (feature IDs), Appendix B.2 (entry template)"
  note: >-
    Seeded content only: no control is implemented or verified yet, no risk is accepted and
    no CSO triage has happened. Owners are the squads of the owning modules in BUILD-PROMPT §5.2.

risk_vocabulary:
  id: risk-vocabulary
  marker: "[P]"
  status: proposed
  note: >-
    Engineering proposal of this build [P], awaiting CSO confirmation [HUMAN]. The words follow the
    Appendix B.2 family. The definitions are in docs/safety/README.md. The matrix maps severity and
    likelihood to a risk level; the check rejects an initial or proposed residual risk whose level
    disagrees with it. Changing the vocabulary or the matrix is a CSO decision recorded by a
    sign-off record for subject risk-vocabulary.
  severity: [negligible, minor, serious, major, catastrophic]
  likelihood: [improbable, remote, occasional, probable, frequent]
  level: [low, medium, high, very-high]
  matrix:
    negligible: {improbable: low, remote: low, occasional: low, probable: low, frequent: medium}
    minor: {improbable: low, remote: low, occasional: medium, probable: medium, frequent: high}
    serious: {improbable: low, remote: medium, occasional: medium, probable: high, frequent: high}
    major: {improbable: medium, remote: medium, occasional: high, probable: very-high, frequent: very-high}
    catastrophic: {improbable: medium, remote: high, occasional: very-high, probable: very-high, frequent: very-high}
  approval: {status: requested, required: [cso], approved_by: [], record: null}

