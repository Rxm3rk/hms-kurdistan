  # ---------------------------------------------------------------------------------------------
  - id: HAZ-0016
    title: A clinician acts on the wrong patient's chart, or misses safety-critical patient facts on a screen or print
    description: >-
      A clinical screen, mobile view or print lacks the banner or one of its elements, a window mixes
      two patients, or a clinician signs for the wrong patient just after switching context.
    seeded_hazard: H1
    invariants: [SI-16]
    invariant_text: "The banner (photo, two identifiers, allergies with \"NKA\" distinct from \"not assessed\", code status, isolation, dated weight, trilingual name display) appears on every clinical screen, mobile view and print. One patient context per window. Identity is re-verified at signing if the context changed within the last 60 s"
    invariant_clauses:
      - {id: a, text: "The banner (photo, two identifiers,"}
      - {id: b, text: "allergies with \"NKA\" distinct from \"not assessed\","}
      - {id: c, text: "code status, isolation, dated weight, trilingual name display)"}
      - {id: d, text: "appears on every clinical screen, mobile view and print."}
      - {id: e, text: "One patient context per window."}
      - {id: f, text: "Identity is re-verified at signing if the context changed within the last 60 s"}
    enforced_in: "Design-system shell"
    modules: [record, empi, platform-docs]
    features: [CLN-CHT-01, CLN-CHT-02, CLN-ACP-01, CLN-IPC-01, ACC-ID-03, PLT-UX-01, PLT-UX-02, PLT-UX-03, PLT-UX-04, KRI-LOC-01, INT-DOC-01]
    sac: [SAC-02, SAC-05, SAC-11, SAC-51]
    causes:
      - A screen or print built without the banner component, or with fields missing
      - '"No known allergies" and "not assessed" shown the same way'
      - Two patients open in one window
      - Signing seconds after switching patient, on the wrong record
      - Similar names in different scripts not flagged
    effects: Orders, notes or medicines applied to the wrong patient; an allergy, code status or isolation need missed
    initial_risk:
      severity: catastrophic
      likelihood: occasional
      level: very-high
      basis: >-
        Agent proposal for CSO triage, not an acceptance. Severity: a wrong-chart order or a missed
        allergy can kill. Likelihood: judged before the controls below; no measured local rate exists
        yet.
    controls:
      - id: CTRL-0016-1
        type: design
        risk_control_option: design
        covers: [preamble]
        description: >-
          SI-16 is enforced below the API for every channel: the banner data, the patient context and
          the re-verification rule are server-side, and the design-system shell only renders them;
          the rule is vendor-locked in the configuration chain: a tenant may tighten it and can never
          loosen it (including the 60-second window).
        sources: ["§2.1 (preamble)", "§2.2 rule 7", "§6.6", "K §5.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-16-channels-*"
          - "PropertyTest:config-chain-vendor-lock-SI-16"
      - id: CTRL-0016-2
        type: test
        risk_control_option: protective
        covers: [preamble]
        description: >-
          Property-based tests on the order-sign and document-sign commands with context changes
          (short runs in the fast tier; nightly 10⁶ sequences plus at least 10⁴ per real channel
          adapter, zero violations); the nightly identity scenario suite (similar-name alerts,
          cross-script duplicates).
        sources: ["§2.1 (preamble)", "§18.3", "§18.5 #6", "§19.1"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-16-*"
          - "ScenarioSuite:identity"
      - id: CTRL-0016-3
        type: design
        risk_control_option: design
        covers: [a, c]
        description: >-
          The banner is one design-system component, never a per-screen implementation, with fixed
          fields: photo, two identifiers, allergies, code status, isolation, dated weight and the
          trilingual name, plus sensitivity indicators where the user is entitled to see them.
        sources: ["§2.1 SI-16", "§9.4 (the banner)", "§14.2", "SAC-02", "SAC-11"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "UnitTest:banner-renders-every-field"
          - "E2E:banner-trilingual-rtl (en, ckb, ar; WP-0.7)"
          - "AcceptanceTest:SAC-02"
      - id: CTRL-0016-4
        type: design
        risk_control_option: design
        covers: [b]
        description: >-
          Allergy status distinguishes "NKA" (assessed, no known allergies) from "not assessed" in the
          data model and on the banner, everywhere.
        sources: ["§2.1 SI-16", "§9.4 (the banner)", "CLN-CHT-02", "SAC-51"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "UnitTest:allergy-status-nka-distinct-from-not-assessed"
          - "AcceptanceTest:SAC-51"
      - id: CTRL-0016-5
        type: test
        risk_control_option: protective
        covers: [d]
        description: >-
          A fitness function fails the build when a clinical route, mobile view or print template lacks
          the banner.
        sources: ["§2.1 SI-16", "§6.5 (the banner)", "§6.8 item 6", "§9.4 acceptance"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "ArchTest:banner-present-on-every-clinical-route"
          - "E2E:banner-on-every-mobile-clinical-view"
          - "TemplateLint:banner-on-every-clinical-print"
        notes: >-
          Tightening [P] (§3.4 item 1): the fitness function's reach beyond clinical routes, and the
          template linter for print templates, are this build's proposals. §6.8 item 6 makes the
          banner a fitness function on clinical routes only. §2.1 SI-16 and §9.4 require the banner on
          every mobile view and print, and the §9.4 acceptance asks for a banner test that passes on
          every clinical route and print, but they name no linter for print templates (the plan's
          only template linter checks message bodies, §9.30). It adds build-time checks and replaces
          no clause; the CSO confirms or removes it [HUMAN] (docs/safety/README.md, "Tightenings").
      - id: CTRL-0016-6
        type: design
        risk_control_option: design
        covers: [e]
        description: >-
          Each window holds exactly one patient context; opening another patient replaces it after
          confirmation and never mixes two patients in one window.
        sources: ["§2.1 SI-16", "§6.5", "§21 WP-0.7 (patient-context management)"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "E2E:one-patient-context-per-window"
        notes: >-
          Tightening [P] (§3.4 item 1): the confirmation before another patient replaces the context
          is this build's proposal. §2.1 SI-16, §6.5, §7 item 20 and §21 WP-0.7 require one patient
          context per window and patient-context management, but name no confirmation step. It adds
          a step and replaces no clause; the CSO confirms or removes it [HUMAN]
          (docs/safety/README.md, "Tightenings").
      - id: CTRL-0016-7
        type: design
        risk_control_option: protective
        covers: [f]
        description: >-
          Sign commands carry the time of the last patient-context change; the server refuses to sign
          without identity re-verification if the context changed within the last 60 seconds.
        sources: ["§2.1 SI-16", "§8.4 (order: sign)", "§9.4 acceptance"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "PropertyTest:SI-16-re-verification-at-signing-after-recent-context-change"
          - "E2E:sign-after-context-change-forces-re-verification"
      - id: CTRL-0016-8
        type: design
        risk_control_option: protective
        covers: [a]
        description: >-
          A photo is captured at registration and shown on the banner, MAR and order entry;
          similar-name warnings appear at registration and search, distinct across scripts, and
          retract-and-reorder is monitored.
        sources: ["§9.1 (photo, search before create)", "SAC-02", "SAC-05"]
        state: planned
        implemented_in: []
        verified_by: []
        planned_verification:
          - "AcceptanceTest:SAC-02"
          - "AcceptanceTest:SAC-05"
